<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappa Editor v0.3</title>
<style>
:root{--bg:#0e0e14;--panel:#181822;--panel2:#22222f;--line:#33334a;--txt:#ecebf5;--mut:#9a98b3;--pur:#8b5cf6;--purl:#c4b5fd;--yel:#facc15;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
h1{font-size:18px;margin:0}h1 span{color:var(--pur)}
.ver{font-size:12px;color:var(--mut)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 10px 10px;padding:12px}
.player{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;display:none}
.player.has video{display:block}
.empty{color:var(--mut);text-align:center;padding:16px;font-size:14px}
.player.has .empty{display:none}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--pur);border-color:var(--pur);font-weight:600}
.danger{color:#fca5a5;border-color:#7f1d1d}
input[type=file]{display:none}
.sl{margin-top:10px}.sl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.sl b{color:var(--txt);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:32px;margin:4px 0}
#sS{accent-color:var(--purl)}#sE{accent-color:var(--yel)}
.tlhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:8px}
.tlhead b{color:var(--txt);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.track{display:flex;gap:3px;min-height:68px;width:max-content;min-width:100%;user-select:none;-webkit-user-select:none}
.clip{position:relative;height:68px;border-radius:8px;background:#2d2650;border:2px solid transparent;display:flex;overflow:hidden;flex:none}
.clip.sel{border-color:var(--pur);background:#3b2f73}
.clip .body{flex:1;min-width:0;padding:6px 4px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.clip .body b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .body span{font-size:11px;color:var(--mut)}
.h{flex:none;width:22px;touch-action:none;cursor:ew-resize;display:flex;align-items:center;justify-content:center}
.h::after{content:"";width:4px;height:28px;border-radius:2px;background:currentColor}
.hl{color:var(--purl);background:rgba(196,181,253,.25)}
.hr{color:var(--yel);background:rgba(250,204,21,.25)}
.tlempty{color:var(--mut);font-size:13px;padding:20px 4px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;border:1px solid transparent}
li.sel{border-color:var(--pur);background:var(--panel2)}
li .i{width:26px;height:26px;border-radius:50%;background:var(--pur);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
li .t{flex:1;min-width:0;cursor:pointer}
li .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .t span{font-size:12px;color:var(--mut)}
li button{min-width:44px;padding:0 10px}
#msg{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0));max-width:880px;margin:0 auto;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:none;z-index:9}
#msg.err{border-color:var(--red);color:#fecaca}
#msg.load{border-color:var(--pur)}
</style>
</head>
<body>
<header><h1>Mappa <span>Editor</span></h1><span class="ver">v0.3</span></header>

<section class="panel">
  <div class="player" id="player">
    <video id="vid" playsinline preload="metadata"></video>
    <div class="empty">Nenhum vídeo ainda.<br>Toque em “Adicionar vídeos”.</div>
  </div>
  <p class="note">Pré-visualização do clipe selecionado (não é a montagem completa).</p>
  <div class="row">
    <label class="btn primary" for="file">+ Adicionar vídeos</label>
    <input id="file" type="file" accept="video/*" multiple>
    <button id="bPlay" disabled>▶ Reproduzir</button>
    <button id="bStart" disabled>⏮ Início do trecho</button>
  </div>
  <div class="sl"><label><span>Início do clipe</span><b id="vS">0:00.0</b></label><input type="range" id="sS" min="0" max="1" step="0.1" value="0" disabled></div>
  <div class="sl"><label><span>Fim do clipe</span><b id="vE">0:00.0</b></label><input type="range" id="sE" min="0" max="1" step="0.1" value="1" disabled></div>
  <div class="row">
    <button id="bDel" class="danger" disabled>🗑 Excluir clipe selecionado</button>
    <button id="bExp">Exportar (em breve)</button>
  </div>
</section>

<section class="panel">
  <div class="tlhead"><span>Linha do tempo</span><span>Total: <b id="total">0:00.0</b></span></div>
  <div class="scroll"><div class="track" id="track"></div></div>
  <p class="note">Alça roxa ajusta o início, alça amarela ajusta o fim. Role para os lados se houver muitos clipes.</p>
</section>

<section class="panel">
  <div class="tlhead"><span>Clipes</span><span id="count">0</span></div>
  <ul id="list"></ul>
</section>

<div id="msg"></div>

<script>
(function(){
'use strict';
// ===== Configuração =====
var MIN=0.5;      // duração mínima de um clipe (s)
var PPS=40;       // pixels por segundo na linha do tempo
var MINW=84;      // largura mínima visual do bloco (px)

// ===== Estado =====
var clips=[];     // {id,name,url,duration,start,end}
var selId=null, nextId=1, drag=null, raf=0, msgTimer=0;

var $=function(s){return document.querySelector(s)};
var vid=$('#vid'),track=$('#track'),list=$('#list');
var sS=$('#sS'),sE=$('#sE'),bPlay=$('#bPlay'),bStart=$('#bStart'),bDel=$('#bDel');

// ===== Utilidades =====
function fmt(t){t=Math.max(0,t);var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function kept(c){return c.end-c.start}
function total(){return clips.reduce(function(a,c){return a+kept(c)},0)}
function get(id){for(var i=0;i<clips.length;i++)if(clips[i].id===id)return clips[i];return null}
function sel(){return get(selId)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function say(text,type,ms){
  var m=$('#msg');m.textContent=text;m.className=type||'';m.style.display='block';
  clearTimeout(msgTimer);if(ms)msgTimer=setTimeout(function(){m.style.display='none'},ms);
}
function hideMsg(){clearTimeout(msgTimer);$('#msg').style.display='none'}

// ===== Importação =====
function probe(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),v=document.createElement('video'),done=false,t;
    function fin(err,d){
      if(done)return;done=true;clearTimeout(t);
      v.removeAttribute('src');v.load();
      if(err){URL.revokeObjectURL(url);rej(err)}else res({url:url,duration:d});
    }
    t=setTimeout(function(){fin(new Error('tempo esgotado'))},15000);
    v.preload='metadata';v.muted=true;
    v.onloadedmetadata=function(){var d=v.duration;(isFinite(d)&&d>0)?fin(null,d):fin(new Error('duração inválida'))};
    v.onerror=function(){fin(new Error('formato não suportado'))};
    v.src=url;
  });
}
async function addFiles(files){
  var ok=0,bad=[],n=files.length;
  for(var i=0;i<n;i++){
    var f=files[i];
    say('Carregando '+(i+1)+' de '+n+'…','load');
    if(f.type&&f.type.indexOf('video/')!==0){bad.push(f.name);continue}
    try{
      var p=await probe(f);
      var c={id:'c'+(nextId++),name:f.name,url:p.url,duration:p.duration,start:0,end:p.duration};
      clips.push(c);ok++;
      buildTimeline();if(!selId)select(c.id);else update();
    }catch(e){bad.push(f.name)}
  }
  if(bad.length)say('Não foi possível carregar: '+bad.join(', ')+(ok?'. Os demais foram adicionados.':''),'err',6000);
  else if(ok)say(ok+' vídeo(s) adicionado(s).','',2000);
  else hideMsg();
}

// ===== Seleção e exclusão =====
function select(id){
  selId=id;var c=sel();
  if(c&&vid.dataset.id!==c.id){
    vid.pause();vid.dataset.id=c.id;vid.src=c.url;
  }
  update();
}
function removeClip(id){
  var i=clips.findIndex(function(c){return c.id===id});if(i<0)return;
  var c=clips[i];clips.splice(i,1);
  if(drag&&drag.id===id)drag=null;
  if(vid.dataset.id===id){vid.pause();vid.removeAttribute('src');vid.removeAttribute('data-id');vid.load()}
  URL.revokeObjectURL(c.url);
  if(selId===id){selId=null;var nx=clips[i]||clips[i-1];if(nx)selId=nx.id}
  buildTimeline();
  if(selId)select(selId);else update();
}

// ===== Edição de pontos =====
function setStart(c,v){
  c.start=clamp(v,0,c.end-Math.min(MIN,c.duration));
  seekPreview(c,'s');update();
}
function setEnd(c,v){
  c.end=clamp(v,c.start+Math.min(MIN,c.duration),c.duration);
  seekPreview(c,'e');update();
}
function seekPreview(c,w){
  if(c.id!==selId||vid.readyState<1||!vid.paused)return;
  vid.currentTime=w==='s'?c.start:Math.max(c.start,c.end-0.05);
}

// ===== Linha do tempo =====
function buildTimeline(){
  track.innerHTML='';
  if(!clips.length){track.innerHTML='<div class="tlempty">A linha do tempo está vazia.</div>';return}
  clips.forEach(function(c){
    var d=document.createElement('div');d.className='clip';d.dataset.id=c.id;
    d.innerHTML='<div class="h hl" data-h="s"></div><div class="body"><b></b><span></span></div><div class="h hr" data-h="e"></div>';
    d.querySelector('b').textContent=c.name;
    track.appendChild(d);
  });
}
function update(){
  var c=sel();
  // blocos
  Array.prototype.forEach.call(track.querySelectorAll('.clip'),function(el){
    var k=get(el.dataset.id);if(!k)return;
    el.style.width=Math.max(MINW,kept(k)*PPS)+'px';
    el.querySelector('span').textContent=fmt(kept(k));
    el.classList.toggle('sel',k.id===selId);
  });
  $('#total').textContent=fmt(total());
  $('#count').textContent=clips.length+(clips.length===1?' clipe':' clipes');
  // lista
  list.innerHTML='';
  clips.forEach(function(k,i){
    var li=document.createElement('li');li.dataset.id=k.id;if(k.id===selId)li.className='sel';
    li.innerHTML='<div class="i">'+(i+1)+'</div><div class="t"><b>'+esc(k.name)+'</b><span>'+fmt(kept(k))+' mantidos de '+fmt(k.duration)+'</span></div><button class="danger" data-del="1" aria-label="Excluir clipe">🗑</button>';
    list.appendChild(li);
  });
  // controles
  var has=!!c;
  $('#player').classList.toggle('has',has);
  [sS,sE,bPlay,bStart,bDel].forEach(function(b){b.disabled=!has});
  if(has){
    sS.max=sE.max=c.duration;sS.value=c.start;sE.value=c.end;
    $('#vS').textContent=fmt(c.start);$('#vE').textContent=fmt(c.end);
  }else{
    sS.value=0;sE.value=1;$('#vS').textContent=$('#vE').textContent='0:00.0';
  }
  bPlay.textContent=vid.paused?'▶ Reproduzir':'⏸ Pausar';
}

// ===== Eventos: alças (pointer events) =====
track.addEventListener('pointerdown',function(e){
  var h=e.target.closest('.h');
  if(h){
    var el=h.parentNode,c=get(el.dataset.id);if(!c)return;
    e.preventDefault();
    if(selId!==c.id)select(c.id);
    drag={id:c.id,w:h.dataset.h,x:e.clientX,s:c.start,e:c.end,pid:e.pointerId};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    return;
  }
  var cl=e.target.closest('.clip');
  if(cl&&cl.dataset.id!==selId)select(cl.dataset.id);
});
track.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  e.preventDefault();
  var c=get(drag.id);if(!c){drag=null;return}
  var dt=(e.clientX-drag.x)/PPS;
  if(drag.w==='e')setEnd(c,drag.e+dt);else setStart(c,drag.s+dt);
});
function endDrag(e){if(drag&&e.pointerId===drag.pid)drag=null}
track.addEventListener('pointerup',endDrag);
track.addEventListener('pointercancel',endDrag);
track.addEventListener('lostpointercapture',endDrag);
track.addEventListener('contextmenu',function(e){e.preventDefault()});

// ===== Eventos: lista e botões =====
list.addEventListener('click',function(e){
  var li=e.target.closest('li');if(!li)return;
  if(e.target.closest('[data-del]'))removeClip(li.dataset.id);else select(li.dataset.id);
});
$('#file').addEventListener('change',function(e){
  var f=Array.prototype.slice.call(e.target.files);e.target.value='';
  if(f.length)addFiles(f);
});
sS.addEventListener('input',function(){var c=sel();if(c){setStart(c,parseFloat(sS.value))}});
sE.addEventListener('input',function(){var c=sel();if(c){setEnd(c,parseFloat(sE.value))}});
bDel.addEventListener('click',function(){if(selId)removeClip(selId)});
bStart.addEventListener('click',function(){var c=sel();if(c&&vid.readyState>0)vid.currentTime=c.start});
bPlay.addEventListener('click',function(){
  var c=sel();if(!c)return;
  if(vid.paused){var p=vid.play();if(p&&p.catch)p.catch(function(){say('Não foi possível reproduzir este vídeo.','err',4000)})}
  else vid.pause();
});
$('#bExp').addEventListener('click',function(){say('A exportação ainda não foi implementada. Ela virá em uma versão futura.','',4000)});

// ===== Reprodução respeitando início/fim =====
vid.addEventListener('loadedmetadata',function(){var c=sel();if(c&&vid.dataset.id===c.id)vid.currentTime=c.start});
vid.addEventListener('error',function(){if(vid.getAttribute('src'))say('Erro ao carregar o vídeo selecionado.','err',4000)});
vid.addEventListener('play',function(){
  var c=sel();if(c&&(vid.currentTime<c.start-0.05||vid.currentTime>=c.end-0.05))vid.currentTime=c.start;
  cancelAnimationFrame(raf);loop();update();
});
vid.addEventListener('pause',function(){cancelAnimationFrame(raf);update()});
vid.addEventListener('ended',function(){var c=sel();if(c)vid.currentTime=c.start});
function loop(){
  var c=sel();
  if(c&&!vid.paused&&vid.currentTime>=c.end-0.03){vid.pause();vid.currentTime=c.start;return}
  if(c&&!vid.paused&&vid.currentTime<c.start-0.2)vid.currentTime=c.start;
  raf=requestAnimationFrame(loop);
}

window.addEventListener('beforeunload',function(){clips.forEach(function(c){URL.revokeObjectURL(c.url)})});
buildTimeline();update();
})();
</script>
</body>
</html>

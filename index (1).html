<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappa Editor v4.3</title>
<style>
/* ===== CORES (mude aqui) ===== */
:root{
  --bg:#0b0b12; --panel:#13131d; --card:#1b1b28; --line:#262636;
  --txt:#f2f2f7; --mut:#8d8da3; --roxo:#8b5cf6; --roxo2:#a78bfa;
  --ciano:#22d3ee; --verm:#ff4d4d; --amar:#facc15;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07070b;color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{max-width:560px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* ===== TOPO ===== */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:2px solid var(--line)}
.logo{font-size:20px;font-weight:600}.logo b{color:var(--roxo2);font-weight:600}
.ver{font-size:11px;color:var(--mut);background:var(--card);padding:3px 8px;border-radius:8px;margin-left:6px}
.topo-dir{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut)}.topo-dir b{color:var(--txt)}
#btnExp{display:flex;align-items:center;gap:6px;background:var(--roxo);padding:9px 16px;border-radius:20px;font-weight:600;box-shadow:0 4px 14px #8b5cf655}
#btnExp .i{width:17px;height:17px}

/* ===== PREVIEW ===== */
#stage{position:relative;flex:1 1 0;min-height:140px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#vid{max-width:100%;max-height:100%;display:none}
#vazio{position:absolute;text-align:center;color:var(--mut)}
#vazio p{margin-bottom:12px;font-size:15px}
#btnAdd{display:inline-flex;align-items:center;gap:8px;background:var(--roxo);color:#fff;padding:12px 22px;border-radius:24px;font-weight:600}
.lado{position:absolute;display:flex;flex-direction:column;gap:10px;top:50%;transform:translateY(-50%);z-index:2}
.lado.e{left:10px}.lado.d{right:10px}
.lado button{width:40px;height:40px;border-radius:12px;background:#1b1b28cc;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}

/* ===== CONTROLES ===== */
#ctrl{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);font-size:13px;color:var(--mut)}
#ctrl div{display:flex;gap:26px;align-items:center;color:var(--txt)}
#ctrl .i{width:22px;height:22px}

/* ===== LINHA DO TEMPO ===== */
#tl{position:relative;height:96px;background:var(--bg);overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line)}
#trilho{position:relative;height:100%;min-width:100%}
#semVid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
.clipe{position:absolute;top:24px;height:52px;border-radius:10px;background:linear-gradient(135deg,#4c3a8f,#6d4fd6);border:2px solid transparent;overflow:hidden;font-size:11px;padding:6px 8px;color:#e9e3ff;white-space:nowrap}
.clipe.sel{border-color:var(--amar)}
.aud{position:absolute;top:92px;height:34px;border-radius:8px;background:#0e3340;border:2px solid var(--ciano);color:var(--ciano);font-size:11px;padding:0 8px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.aud .i{width:14px;height:14px;flex:none}
.aud.sel{border-color:var(--amar);color:var(--amar)}
/* botão + entre clipes (transição) */
.mais{position:absolute;top:38px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--card);border:1.5px solid var(--roxo2);color:var(--roxo2);display:flex;align-items:center;justify-content:center;z-index:6}
.mais .i{width:14px;height:14px}
.mais.on{background:var(--roxo);color:#fff;border-color:#fff}
/* linha vermelha por cima de tudo */
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--verm);box-shadow:0 0 8px var(--verm);pointer-events:none;left:0;z-index:10}
#head::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--verm)}

/* ===== ABAS + ÁUDIO ===== */
#abas{display:flex;gap:8px;padding:10px 10px 6px;overflow-x:auto;background:var(--panel);scrollbar-width:none}
#abas::-webkit-scrollbar{display:none}
#abas button{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;white-space:nowrap}
#abas button .i{width:16px;height:16px}
#abas button.on{background:var(--roxo);border-color:var(--roxo2)}
#bAudio{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 10px 10px;padding:10px;border-radius:10px;border:1px dashed var(--ciano);color:var(--ciano);font-size:13px;background:#0b1f26;width:calc(100% - 20px)}
#bAudio .i{width:17px;height:17px}

/* ===== ÁREA DE TRABALHO ===== */
#area{flex:0 0 auto;border-top:2px solid var(--line);background:var(--bg);padding:10px 12px;min-height:122px}
#area h4{font-size:11px;letter-spacing:.6px;color:var(--mut);margin-bottom:10px;text-transform:uppercase}
.fx{display:flex;gap:10px;overflow-x:auto}
.fx button{flex:none;width:78px;padding:10px 0 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px;color:#cfcfe0}
.fx button.on{border-color:var(--roxo2);background:#2a2150}
.fx span{display:flex;width:38px;height:38px;margin:0 auto 6px;border-radius:10px;background:var(--bg);align-items:center;justify-content:center;color:var(--roxo2)}
.fx span .i{width:22px;height:22px}
.sl{display:grid;grid-template-columns:60px 1fr 48px;gap:10px;align-items:center;font-size:13px;margin:10px 0 0;color:var(--mut)}
.sl input{width:100%;accent-color:var(--roxo)}

/* ===== BARRA INFERIOR ===== */
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--txt)}
nav .i{width:22px;height:22px}
nav button:disabled{opacity:.3;cursor:default}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.on{opacity:1}

/* ===== EXPORTAÇÃO ===== */
#exp{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:100}
#exp div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(86vw,340px);text-align:center}
#exp p{margin-bottom:14px;font-size:14px}
#barra{height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:16px}
#barra i{display:block;height:100%;width:0;background:var(--roxo)}
#cancelar{padding:9px 20px;border-radius:12px;border:1px solid var(--line);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><span class="logo">Mappa<b>Editor</b></span><span class="ver">v4.3</span></div>
    <div class="topo-dir"><span>Total: <b id="total">0:00.0</b></span><button id="btnExp"><span data-i="download"></span>Exportar</button></div>
  </header>

  <div id="stage">
    <video id="vid" playsinline></video>
    <div id="vazio"><p>Sua área de edição está vazia</p><button id="btnAdd"><span data-i="plus"></span>Adicionar vídeo</button></div>
    <div class="lado e"><button id="bFull" data-i="full"></button><button id="bProp" data-i="ratio"></button></div>
    <div class="lado d"><button id="bZoom" data-i="zoom"></button><button id="bMudo" data-i="vol"></button></div>
  </div>

  <div id="ctrl">
    <span id="tempo">0:00.0 / 0:00.0</span>
    <div><button id="bPrev" data-i="prev"></button><button id="bPlay" data-i="play"></button><button id="bNext" data-i="next"></button></div>
  </div>

  <div id="tl"><div id="trilho"><div id="semVid">Sem vídeos na linha do tempo</div><div id="head"></div></div></div>

  <div id="abas">
    <button class="on" data-a="camada"><span data-i="layers"></span><span id="nCam">1 Camada</span></button>
    <button data-a="cortar"><span data-i="scissors"></span>Cortar</button>
    <button data-a="ajuste"><span data-i="sliders"></span>Ajuste</button>
    <button data-a="efeitos"><span data-i="sparkles"></span>Efeitos</button>
    <button data-a="texto"><span data-i="text"></span>Texto</button>
    <button data-a="audio"><span data-i="music"></span>Áudio</button>
    <button data-a="fundo"><span data-i="image"></span>Fundo</button>
  </div>
  <button id="bAudio"><span data-i="music"></span>Adicionar áudio</button>

  <div id="area"></div>

  <nav>
    <button id="nAdd"><span data-i="plus"></span>Adicionar</button>
    <button id="nDiv" disabled><span data-i="scissors"></span>Dividir</button>
    <button id="nAju" disabled><span data-i="sliders"></span>Ajuste</button>
    <button id="nDup" disabled><span data-i="copy"></span>Duplicar</button>
    <button id="nFil"><span data-i="sparkles"></span>Filtros</button>
    <button id="nDel" disabled><span data-i="trash"></span>Excluir</button>
  </nav>
</div>

<div id="exp"><div><p id="expTxt">Exportando… mantenha esta tela aberta</p><div id="barra"><i></i></div><button id="cancelar">Cancelar</button></div></div>
<input type="file" id="file" accept="video/*" multiple hidden>
<input type="file" id="fileA" accept="audio/*" multiple hidden>
<canvas id="cv" hidden></canvas>
<div id="toast"></div>

<script>
/* ===== ÍCONES (SVG simples, 24x24) ===== */
const P = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  sparkles:'<path d="M11 3l1.8 4.7L17.5 9.5l-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',
  full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  ratio:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  zoom:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  vol:'<path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7"/>',
  mute:'<path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/>',
  prev:'<path d="M6 5v14M18 5l-9 7 9 7z"/>',
  next:'<path d="M18 5v14M6 5l9 7-9 7z"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  zoomfx:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  fade:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
  swap:'<path d="M7 8h12l-3-3M17 16H5l3 3"/>',
  none:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'
};
const ic = n => '<svg class="i" viewBox="0 0 24 24">' + P[n] + '</svg>';
document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = ic(e.dataset.i));

/* ===== ESTADO ===== */
const PX = 40;                       // pixels por segundo na linha do tempo
let clips = [], audios = [];         // clip: {url,nome,dur,ini,fim,fx,tr,w,h}  áudio: {el,nome,dur,s,vol}
let sel = -1, selA = -1, trI = -1, gt = 0, tocando = false, atual = -1, painel = 'fx';
const $ = id => document.getElementById(id);
const vid = $('vid');

/* ===== EFEITOS E TRANSIÇÕES ===== */
const FX = {
  glitch:{ic:'zap',nome:'Glitch',css:'hue-rotate(90deg) contrast(1.4) saturate(1.6)'},
  zoom:{ic:'zoomfx',nome:'Zoom',sc:1.25},
  blur:{ic:'drop',nome:'Blur',css:'blur(4px)'},
  fade:{ic:'fade',nome:'Fade',css:'brightness(.6)',op:.8},
  anim:{ic:'film',nome:'Animação',sc:1.05,rot:-3}
};
const TR = {
  fade:{ic:'fade',nome:'Fusão'}, white:{ic:'sun',nome:'Branco'},
  zoom:{ic:'zoomfx',nome:'Zoom'}, slide:{ic:'arrow',nome:'Deslizar'}
};

/* ===== UTILIDADES ===== */
const len = c => c.fim - c.ini;
const fmt = s => { s = Math.max(0, s); return Math.floor(s/60) + ':' + (s%60).toFixed(1).padStart(4,'0'); };
const totalDur = () => clips.reduce((a,c)=>a+len(c),0);
const offset = i => clips.slice(0,i).reduce((a,c)=>a+len(c),0);
const idxAt = g => { let a=0; for(let i=0;i<clips.length-1;i++){ if(g<a+len(clips[i])) return i; a+=len(clips[i]); } return clips.length-1; };
const vplay = () => vid.play().catch(()=>{});
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),1800); }

/* ===== VISUAL ATUAL (efeito + transição) — usado na tela e na exportação ===== */
function trans(L,t,a,dir){
  if(t==='fade'||t==='white'){ L.alpha*=1-a; L.bg = t==='fade' ? '#000' : '#fff'; }
  else if(t==='zoom'){ L.sc*=1+.4*a; L.alpha*=1-a; }
  else if(t==='slide'){ L.tx = -dir*a; }
}
function look(g){
  const L = {filter:'',sc:1,rot:0,tx:0,alpha:1,bg:'#000'};
  if(!clips.length) return L;
  const i = idxAt(g), c = clips[i], lt = g - offset(i), f = c.fx && FX[c.fx];
  if(f){ L.filter=f.css||''; L.sc=f.sc||1; L.rot=f.rot||0; L.alpha=f.op||1; }
  if(c.tr && i<clips.length-1){ const h=Math.min(c.tr.d/2,len(c)/2), rest=len(c)-lt; if(rest<h) trans(L,c.tr.t,1-rest/h,1); }
  const p = clips[i-1];
  if(p && p.tr){ const h=Math.min(p.tr.d/2,len(c)/2); if(lt<h) trans(L,p.tr.t,1-lt/h,-1); }
  return L;
}
function aplicaLook(){
  const L = look(gt);
  vid.style.filter = L.filter; vid.style.opacity = L.alpha;
  vid.style.transform = `translateX(${L.tx*100}%) rotate(${L.rot}deg) scale(${L.sc})`;
  $('stage').style.background = L.bg;
}

/* ===== ADICIONAR VÍDEOS E ÁUDIOS ===== */
$('btnAdd').onclick = $('nAdd').onclick = () => $('file').click();
$('bAudio').onclick = () => $('fileA').click();
$('file').onchange = async e => {
  for (const f of e.target.files) {
    const url = URL.createObjectURL(f);
    const m = await new Promise(r => {
      const v = document.createElement('video'); v.preload = 'metadata'; v.src = url;
      v.onloadedmetadata = () => r({d:v.duration||0,w:v.videoWidth,h:v.videoHeight}); v.onerror = () => r({d:0});
    });
    if (m.d) clips.push({url,nome:f.name,dur:m.d,ini:0,fim:m.d,fx:null,tr:null,w:m.w,h:m.h});
    else toast('Não consegui abrir: ' + f.name);
  }
  e.target.value = '';
  if (sel < 0 && selA < 0 && clips.length) sel = 0;
  atual = -1; seek(gt); render();
};
$('fileA').onchange = async e => {
  for (const f of e.target.files) {
    const url = URL.createObjectURL(f), el = new Audio(url); el.preload = 'auto';
    const d = await new Promise(r => { el.onloadedmetadata = () => r(el.duration||0); el.onerror = () => r(0); });
    if (d) { audios.push({el,nome:f.name,dur:d,s:gt,vol:1}); selA = audios.length-1; sel = -1; painel = 'aud'; }
    else toast('Não consegui abrir: ' + f.name);
  }
  e.target.value = ''; render();
};

/* ===== REPRODUÇÃO ===== */
function seek(g){
  gt = Math.min(Math.max(0,g), totalDur());
  if (!clips.length) { atualizaUI(); return; }
  const i = idxAt(gt), c = clips[i];
  if (atual !== i) { atual = i; vid.src = c.url; }
  vid.currentTime = c.ini + (gt - offset(i));
  if (tocando) vplay();
  aplicaLook(); atualizaUI();
}
function play(){
  if (!clips.length) return;
  if (gt >= totalDur() - 0.05) seek(0);
  tocando = true; vplay(); $('bPlay').innerHTML = ic('pause'); requestAnimationFrame(tick);
}
function pause(){
  tocando = false; vid.pause(); audios.forEach(a => a.el.pause()); $('bPlay').innerHTML = ic('play');
}
function syncAudio(){
  audios.forEach(a => {
    const lt = gt - a.s;
    if (tocando && lt >= 0 && lt < a.dur) {
      if (a.el.paused || Math.abs(a.el.currentTime - lt) > .35) a.el.currentTime = lt;
      if (a.el.paused) a.el.play().catch(()=>{});
    } else if (!a.el.paused) a.el.pause();
  });
}
function tick(){
  if (!tocando) return;
  const c = clips[atual];
  if (c) {
    if (vid.readyState >= 2 && !vid.seeking) {
      if (vid.currentTime >= c.fim - 0.03) {
        if (atual < clips.length-1) { seek(offset(atual+1)); }
        else { pause(); seek(totalDur()); if (exporting) finalizaExport(); return; }
      } else gt = offset(atual) + (vid.currentTime - c.ini);
    }
  }
  aplicaLook(); syncAudio();
  if (exporting) drawFrame();
  atualizaUI(); requestAnimationFrame(tick);
}
$('bPlay').onclick = () => tocando ? pause() : play();
$('bPrev').onclick = () => seek(atual > 0 ? offset(atual-1) : 0);
$('bNext').onclick = () => atual < clips.length-1 && seek(offset(atual+1));

/* ===== LINHA DO TEMPO ===== */
$('trilho').onclick = e => {
  if (!clips.length) return;
  const g = (e.clientX - $('trilho').getBoundingClientRect().left) / PX;
  const i = idxAt(g); sel = i; selA = -1;
  if (painel==='aud' || painel==='tr') painel = 'fx';
  seek(g); render();
};
function atualizaUI(){
  $('tempo').textContent = fmt(gt) + ' / ' + fmt(totalDur());
  $('total').textContent = fmt(totalDur());
  const x = gt * PX; $('head').style.left = x + 'px';
  const tl = $('tl'); if (tocando && x > tl.scrollLeft + tl.clientWidth - 40) tl.scrollLeft = x - 40;
  if (exporting) { $('barra').firstChild.style.width = (gt / Math.max(totalDur(),.1) * 100) + '%'; }
}

/* ===== EDIÇÃO ===== */
function dividir(){
  if (sel < 0) return;
  const c = clips[sel], local = c.ini + (gt - offset(sel));
  if (local <= c.ini + 0.2 || local >= c.fim - 0.2) return toast('Posicione o marcador dentro do clipe');
  clips.splice(sel+1, 0, {...c, ini:local}); c.fim = local; c.tr = null; atual = -1; seek(gt); render();
}
function duplicar(){ if (sel<0) return; clips.splice(sel+1,0,{...clips[sel]}); sel++; atual=-1; render(); }
function excluir(){
  if (selA >= 0) { audios[selA].el.pause(); audios.splice(selA,1); selA = -1; painel='fx'; render(); return; }
  if (sel < 0) return;
  clips.splice(sel,1);
  if (clips.length) { sel = Math.min(sel, clips.length-1); clips[clips.length-1].tr = null; atual=-1; seek(Math.min(gt,totalDur())); }
  else { sel=-1; atual=-1; pause(); vid.removeAttribute('src'); vid.load(); gt=0; }
  render();
}
$('nDiv').onclick = dividir; $('nDup').onclick = duplicar; $('nDel').onclick = excluir;
$('nAju').onclick = () => { painel='adj'; render(); };
$('nFil').onclick = () => { painel='fx'; render(); };

/* ===== ABAS ===== */
document.querySelectorAll('#abas button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#abas button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  const a = b.dataset.a;
  if (a==='cortar') dividir();
  else if (a==='ajuste') { painel='adj'; render(); }
  else if (a==='efeitos') { painel='fx'; render(); }
  else if (a==='audio') $('fileA').click();
  else if (a!=='camada') toast('Em breve!');
});

/* ===== BOTÕES DA PREVIEW ===== */
$('bFull').onclick = () => $('stage').requestFullscreen && $('stage').requestFullscreen();
$('bMudo').onclick = () => { vid.muted = !vid.muted; $('bMudo').innerHTML = ic(vid.muted ? 'mute' : 'vol'); };
$('bProp').onclick = () => toast('Proporção: em breve');
$('bZoom').onclick = () => toast('Zoom da preview: em breve');

/* ===== EXPORTAR ===== */
let exporting = false, cancelou = false, rec = null, chunks = [], actx = null, dest = null, outG = null, mudoAntes = false, mime = '';
const cv = $('cv'), ctx = cv.getContext('2d');
function ligaAudio(el){
  if (el._n) return;
  el._n = actx.createMediaElementSource(el); el._n.connect(dest); el._n.connect(outG);
}
function drawFrame(){
  const L = look(gt), W = cv.width, H = cv.height, vw = vid.videoWidth, vh = vid.videoHeight;
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.fillStyle = L.bg; ctx.fillRect(0,0,W,H);
  if (!vw) return;
  const s = Math.min(W/vw, H/vh), dw = vw*s, dh = vh*s;
  ctx.save(); ctx.globalAlpha = L.alpha; ctx.filter = L.filter || 'none';
  ctx.translate(W/2 + L.tx*dw, H/2); ctx.rotate(L.rot*Math.PI/180); ctx.scale(L.sc, L.sc);
  ctx.drawImage(vid, -dw/2, -dh/2, dw, dh); ctx.restore();
}
async function exportar(){
  if (!clips.length) return toast('Adicione um vídeo primeiro');
  if (!window.MediaRecorder) return toast('Seu navegador não suporta exportação');
  pause();
  mime = ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return toast('Formato de exportação não suportado');
  if (!actx) { actx = new (window.AudioContext||window.webkitAudioContext)(); dest = actx.createMediaStreamDestination(); outG = actx.createGain(); outG.connect(actx.destination); }
  await actx.resume();
  ligaAudio(vid); audios.forEach(a => ligaAudio(a.el));
  outG.gain.value = 0; mudoAntes = vid.muted; vid.muted = false;
  const c0 = clips[0], k = Math.min(1, 1280/Math.max(c0.w||1280, c0.h||720));
  cv.width = Math.round((c0.w||1280)*k/2)*2; cv.height = Math.round((c0.h||720)*k/2)*2;
  const stream = cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:8000000}); chunks = []; cancelou = false;
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    exporting = false; outG.gain.value = 1; vid.muted = mudoAntes; $('exp').style.display = 'none';
    if (cancelou) return toast('Exportação cancelada');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, {type:mime.split(';')[0]}));
    a.download = 'mappa-video.' + (mime.includes('mp4') ? 'mp4' : 'webm'); a.click();
    toast('Vídeo exportado!');
  };
  exporting = true; $('exp').style.display = 'flex'; $('barra').firstChild.style.width = '0';
  atual = -1; seek(0); rec.start(500); play();
}
function finalizaExport(){ if (rec && rec.state !== 'inactive') rec.stop(); }
$('btnExp').onclick = exportar;
$('cancelar').onclick = () => { cancelou = true; pause(); finalizaExport(); };

/* ===== DESENHO DA TELA ===== */
function render(){
  const has = clips.length > 0;
  vid.style.display = has ? 'block' : 'none'; $('vazio').style.display = has ? 'none' : 'block';
  $('semVid').style.display = has ? 'none' : 'flex';
  const clipeSel = sel >= 0;
  ['nDiv','nAju','nDup'].forEach(id => $(id).disabled = !clipeSel);
  $('nDel').disabled = !(clipeSel || selA >= 0);
  $('nCam').textContent = Math.max(1, clips.length) + (clips.length>1 ? ' Camadas' : ' Camada');

  /* linha do tempo: a faixa de áudio só aparece depois de adicionar áudio */
  const tl = $('tl'), tr = $('trilho');
  tl.style.height = (audios.length ? 142 : 96) + 'px';
  const fimAud = audios.reduce((m,a) => Math.max(m, a.s + a.dur), 0);
  tr.style.width = Math.max(totalDur(), fimAud)*PX + 60 + 'px';
  tr.querySelectorAll('.clipe,.aud,.mais').forEach(n => n.remove());
  clips.forEach((c,i) => {
    const d = document.createElement('div'); d.className = 'clipe' + (i===sel?' sel':'');
    d.style.left = offset(i)*PX + 'px'; d.style.width = len(c)*PX - 2 + 'px'; d.textContent = c.nome; tr.appendChild(d);
    if (i < clips.length-1) {   // botão + (transição) entre este clipe e o próximo
      const b = document.createElement('button'); b.className = 'mais' + (c.tr ? ' on' : '');
      b.style.left = offset(i+1)*PX + 'px'; b.innerHTML = ic(c.tr ? 'swap' : 'plus');
      b.onclick = e => { e.stopPropagation(); trI = i; painel = 'tr'; render(); };
      tr.appendChild(b);
    }
  });
  audios.forEach((a,i) => {
    const d = document.createElement('div'); d.className = 'aud' + (i===selA?' sel':'');
    d.style.left = a.s*PX + 'px'; d.style.width = a.dur*PX - 2 + 'px'; d.innerHTML = ic('music') + a.nome;
    d.onclick = e => { e.stopPropagation(); selA = i; sel = -1; painel = 'aud'; render(); };
    tr.appendChild(d);
  });

  /* área de trabalho */
  const area = $('area');
  if (painel==='tr' && trI >= 0 && trI < clips.length-1) {
    const c = clips[trI], t = c.tr;
    area.innerHTML = '<h4>Transição — clipe ' + (trI+1) + ' → ' + (trI+2) + '</h4><div class="fx"><button data-k=""' + (!t?' class="on"':'') + '><span>' + ic('none') + '</span>Nenhuma</button>' +
      Object.entries(TR).map(([k,f]) => '<button data-k="'+k+'" class="'+(t&&t.t===k?'on':'')+'"><span>'+ic(f.ic)+'</span>'+f.nome+'</button>').join('') + '</div>' +
      '<div class="sl">Duração<input type="range" id="sD" min="0.4" max="2" step="0.1" value="'+(t?t.d:1)+'" '+(t?'':'disabled')+'><span id="vD">'+(t?t.d:1)+'s</span></div>';
    area.querySelectorAll('.fx button').forEach(b => b.onclick = () => { c.tr = b.dataset.k ? {t:b.dataset.k, d:t?t.d:1} : null; aplicaLook(); render(); });
    $('sD').oninput = e => { c.tr.d = +e.target.value; $('vD').textContent = c.tr.d + 's'; };
  } else if (painel==='aud' && selA >= 0) {
    const a = audios[selA];
    area.innerHTML = '<h4>Áudio — ' + a.nome + '</h4><div class="sl">Volume<input type="range" id="sV" min="0" max="1" step="0.05" value="'+a.vol+'"><span id="vV">'+Math.round(a.vol*100)+'%</span></div>';
    $('sV').oninput = e => { a.vol = +e.target.value; a.el.volume = a.vol; $('vV').textContent = Math.round(a.vol*100) + '%'; };
  } else if (painel==='adj' && clipeSel) {
    const c = clips[sel];
    area.innerHTML = '<h4>Ajuste de trecho</h4>' +
      '<div class="sl">Início<input type="range" id="sI" min="0" max="'+c.dur+'" step="0.1" value="'+c.ini+'"><span id="vI">'+fmt(c.ini)+'</span></div>' +
      '<div class="sl">Fim<input type="range" id="sF" min="0" max="'+c.dur+'" step="0.1" value="'+c.fim+'"><span id="vF">'+fmt(c.fim)+'</span></div>';
    $('sI').oninput = e => { c.ini = Math.min(+e.target.value, c.fim-0.3); $('vI').textContent = fmt(c.ini); ajusta(); };
    $('sF').oninput = e => { c.fim = Math.max(+e.target.value, c.ini+0.3); $('vF').textContent = fmt(c.fim); ajusta(); };
  } else {
    const c = clipeSel ? clips[sel] : null;
    area.innerHTML = '<h4>Área de trabalho — Efeitos &amp; Transições</h4><div class="fx">' +
      Object.entries(FX).map(([k,f]) => '<button data-k="'+k+'" class="'+(c&&c.fx===k?'on':'')+'"><span>'+ic(f.ic)+'</span>'+f.nome+'</button>').join('') + '</div>';
    area.querySelectorAll('.fx button').forEach(b => b.onclick = () => {
      if (!c) return toast('Adicione e selecione um clipe');
      c.fx = c.fx === b.dataset.k ? null : b.dataset.k; aplicaLook(); render();
    });
  }
  atualizaUI();
}
function ajusta(){   // atualiza só a linha do tempo enquanto arrasta os sliders
  $('trilho').style.width = totalDur()*PX + 60 + 'px';
  $('trilho').querySelectorAll('.clipe').forEach((n,i) => { n.style.left = offset(i)*PX+'px'; n.style.width = len(clips[i])*PX-2+'px'; });
  atual = -1; seek(Math.min(gt,totalDur()));
}
render();
</script>
</body>
</html>

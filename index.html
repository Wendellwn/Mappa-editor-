<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappa Editor v8.0</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
/* ===== CORES (mude aqui) ===== */
:root{--bg:#0b0b12;--panel:#13131d;--card:#1b1b28;--line:#262636;--txt:#f2f2f7;--mut:#8d8da3;--roxo:#8b5cf6;--roxo2:#a78bfa;--ciano:#22d3ee;--verm:#ff4d4d;--amar:#facc15}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07070b;color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{max-width:560px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* topo */
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--line)}
.logo{font-size:20px;font-weight:600}.logo b{color:var(--roxo2);font-weight:600}
.ver{font-size:11px;color:var(--mut);background:var(--card);padding:3px 8px;border-radius:8px;margin-left:6px}
.topo-dir{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut)}.topo-dir b{color:var(--txt)}
#btnExp{display:flex;align-items:center;gap:6px;background:var(--roxo);padding:9px 16px;border-radius:20px;font-weight:600;box-shadow:0 4px 14px #8b5cf655}
#btnExp .i{width:17px;height:17px}
/* preview */
#stage{position:relative;flex:1 1 0;min-height:110px;background:#000;overflow:hidden}
.lay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none;will-change:transform,opacity;backface-visibility:hidden}
#vazio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);z-index:1}
#vazio p{margin-bottom:12px;font-size:15px}
#btnAdd{display:inline-flex;align-items:center;gap:8px;background:var(--roxo);color:#fff;padding:12px 22px;border-radius:24px;font-weight:600}
.lado{position:absolute;display:flex;flex-direction:column;gap:10px;top:50%;transform:translateY(-50%);z-index:1000}
.lado.d{right:10px}
.lado button{width:38px;height:38px;border-radius:12px;background:#1b1b28cc;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.fs{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:8px;background:#000a;border:1px solid #ffffff2e;display:flex;align-items:center;justify-content:center;z-index:1000;color:#fff;opacity:.85}
.fs .i{width:16px;height:16px}
/* controles */
#ctrl{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);font-size:13px;color:var(--mut)}
#ctrl div{display:flex;gap:26px;align-items:center;color:var(--txt)}
#ctrl .i{width:22px;height:22px}
#tools{display:flex;justify-content:flex-end;gap:6px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line)}
#tools button{width:34px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#tools .i{width:16px;height:16px}
#tools button:disabled{opacity:.3}
#head.mag{width:3px;background:var(--amar);box-shadow:0 0 14px var(--amar),0 0 4px var(--amar)}
/* faixa de arrastar (navegação com o dedo) */
#scrub{position:relative;flex:0 0 auto;height:46px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;overflow:hidden;
 background-image:linear-gradient(90deg,#ffffff45 0,#ffffff45 1px,transparent 1px);background-repeat:repeat-x;background-position:0 100%;background-size:40px 14px}
#scrub span{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:11px;color:var(--mut);pointer-events:none;letter-spacing:.3px}
#scrub::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--verm);opacity:.85;pointer-events:none}
#scrub.on{background-color:#222236}#scrub.on span{color:var(--roxo2)}
/* linha do tempo */
#tlWrap{position:relative;flex:0 0 auto;min-height:84px;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
#tl{position:relative;height:96px;background:var(--bg);overflow:auto;touch-action:pan-x pan-y;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
#trilho{position:relative;min-width:100%;user-select:none;-webkit-user-select:none}
#semVid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;pointer-events:none}
.row{position:absolute;left:0;right:0;border-top:1px solid #ffffff0d}
.gut{position:absolute;left:0;right:0;font-size:9px;color:var(--mut);text-align:center;border:1px dashed transparent;line-height:22px}
.drag .gut{border-color:var(--roxo2)}
.it{position:absolute;z-index:2;border-radius:8px;border:2px solid transparent;overflow:hidden;font-size:10px;padding:0 6px;display:flex;align-items:center;gap:4px;white-space:nowrap;user-select:none;-webkit-user-select:none}
.it.v{background:linear-gradient(135deg,#4c3a8f,#6d4fd6);color:#e9e3ff}
.it.a{background:#0e3340;border-color:var(--ciano);color:var(--ciano)}
.it{touch-action:pan-x pan-y;-webkit-touch-callout:none}
.it.sel{border-color:var(--amar)}
.it.lift{z-index:9;box-shadow:0 6px 18px #000a;opacity:.92}
.it .i{width:13px;height:13px;flex:none}
.it.a .i,.it .nm{position:relative;z-index:1}.it .nm{overflow:hidden;text-overflow:ellipsis}
.wf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.hd{position:absolute;top:0;bottom:0;width:14px;max-width:35%;z-index:3;touch-action:none;background:var(--amar);display:flex;align-items:center;justify-content:center}
.hd::after{content:"";width:2px;height:40%;background:#000;border-radius:2px}
.hd.l{left:0;border-radius:6px 0 0 6px}.hd.r{right:0;border-radius:0 6px 6px 0}
.hint{position:absolute;font-size:10px;color:var(--mut);pointer-events:none;display:flex;align-items:center;white-space:nowrap}
.trb{position:absolute;z-index:1;background:#8b5cf64d;border:1px dashed var(--roxo2);border-radius:6px;pointer-events:none}
.mais{position:absolute;z-index:6;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--card);border:1.5px solid var(--roxo2);color:var(--roxo2);display:flex;align-items:center;justify-content:center}
.mais .i{width:14px;height:14px}
.mais{box-shadow:0 2px 8px #0009}
.mais.on{box-shadow:0 0 0 2px #8b5cf655,0 2px 8px #0009}
.mais.on{background:var(--roxo);color:#fff;border-color:#fff}
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--verm);box-shadow:0 0 8px var(--verm);pointer-events:none;left:50%;transform:translateX(-1px);z-index:20}
#head::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--verm)}
/* gaveta (efeitos, ajustes, duração, transição) */
#gaveta{display:none;flex:0 0 auto;max-height:40vh;overflow-y:auto;background:var(--panel);border-top:2px solid var(--line);padding:0 12px 10px}
.gh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);padding:10px 0;z-index:3;font-size:14px}
.gh button{display:flex;gap:10px}
.msg{color:var(--mut);font-size:13px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{padding:8px 0 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11px;color:#cfcfe0}
.grid button.on{border-color:var(--roxo2);background:#2a2150}
.grid span{display:flex;justify-content:center;color:var(--roxo2);margin-bottom:4px}
h5{font-size:11px;letter-spacing:.6px;color:var(--mut);text-transform:uppercase;margin:12px 0 2px}
.sl{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:8px}
.sl input{width:100%;accent-color:var(--roxo)}
.sl em{font-style:normal;text-align:right;color:var(--txt);font-size:12px}
.arow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.arow::-webkit-scrollbar{display:none}
.arow button{flex:0 0 auto;min-width:68px;padding:8px 6px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11px;color:#cfcfe0}
.arow button.on{border-color:var(--roxo2);background:#2a2150}.arow span{display:flex;justify-content:center;color:var(--roxo2);margin-bottom:4px}
.reset{margin-top:12px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:12px}
/* barra inferior */
nav{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
nav button.on{color:var(--roxo2)}
nav .i{width:22px;height:22px}
nav button:disabled{opacity:.3;cursor:default}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.on{opacity:1}
#exp{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:100}
#exp>div{background:transparent;border:0;border-radius:0;padding:24px;width:min(88vw,360px);text-align:center}
#exp p{margin-bottom:14px;font-size:14px}
#expPreview{position:relative;width:100%;max-height:32vh;aspect-ratio:16/9;background:#050509;border-radius:8px;overflow:hidden;margin:0 auto 14px}
#expThumb{width:100%;height:100%;object-fit:contain;display:block}
#expFill{position:absolute;inset:0 0 auto;height:0;background:#8b5cf6b8;pointer-events:none;transition:height .12s}
#expPercent{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;text-shadow:0 2px 8px #000;z-index:2}
#barra{display:none;height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:16px}
#barra i{display:block;height:100%;width:0;background:var(--roxo)}
#cancelar{padding:9px 20px;border-radius:12px;border:1px solid var(--line);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><span class="logo">Mappa<b>Editor</b></span><span class="ver">v8.0</span></div>
    <div class="topo-dir"><span>Total: <b id="total">0:00.0</b></span><button id="btnExp"><span data-i="download"></span>Exportar</button></div>
  </header>
  <div id="stage">
    <div id="vazio"><p>Sua área de edição está vazia</p><button id="btnAdd"><span data-i="plus"></span>Adicionar vídeo</button></div>
    <div class="lado d"><button id="bMudo" data-i="vol"></button></div>
    <button id="bFull" class="fs" data-i="full" title="Tela cheia" aria-label="Tela cheia"></button>
  </div>
  <div id="ctrl"><span id="tempo">0:00.0 / 0:00.0</span><div><button id="bPrev" data-i="prev"></button><button id="bPlay" data-i="play"></button><button id="bNext" data-i="next"></button></div></div>
  <div id="tools">
    <span style="margin-right:auto;display:flex;gap:6px"><button id="bUndo" data-i="undo" title="Desfazer" aria-label="Desfazer"></button><button id="bRedo" data-i="redo" title="Refazer" aria-label="Refazer"></button></span>
    <button id="zMenos" data-i="minus"></button><button id="zMais" data-i="plus"></button>
    <button id="zFit" data-i="fit"></button><button id="zAlt" data-i="height"></button>
  </div>
  <div id="scrub"><span>‹ deslize aqui para navegar ›</span></div>
  <div id="tlWrap"><div id="tl"><div id="trilho"><div id="semVid">Sem vídeos na linha do tempo</div></div></div><div id="head"></div></div>
  <div id="gaveta"></div>
  <nav>
    <button id="nAdd"><span data-i="plus"></span>Adicionar</button>
    <button id="nOver"><span data-i="overlay"></span>Sobrepor</button>
    <button id="nAud"><span data-i="music"></span>Áudio</button>
    <button id="nExtract"><span data-i="download"></span>Extrair áudio</button>
    <button id="nDiv"><span data-i="scissors"></span>Dividir</button>
    <button id="nDur"><span data-i="clock"></span>Duração</button>
    <button id="nAju"><span data-i="sliders"></span>Ajustes</button>
    <button id="nSpd"><span data-i="gauge"></span>Velocidade</button>
    <button id="nFlt"><span data-i="filter"></span>Filtros</button>
    <button id="nVol"><span data-i="vol"></span>Volume</button>
    <button id="nMute"><span data-i="mute"></span>Silenciar</button>
    <button id="nFx"><span data-i="sparkles"></span>Efeitos</button>
    <button id="nDup"><span data-i="copy"></span>Duplicar</button>
    <button id="nDel"><span data-i="trash"></span>Excluir</button>
  </nav>
</div>
<div id="exp"><div><p style="color:#fff;margin-bottom:18px">Exportando vídeo…</p><div id="expPreview"><canvas id="expThumb"></canvas><div id="expFill"></div><div id="expPercent">0%</div></div><div id="barra"><i></i></div><button id="cancelar">Cancelar</button></div></div>
<input type="file" id="file" accept="video/*" multiple hidden>
<input type="file" id="fileA" accept="audio/*,video/*" multiple hidden>
<canvas id="cv" hidden></canvas>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="toast"></div>

<script>
/* ===== ÍCONES ===== */
const P={
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',
scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
sparkles:'<path d="M11 3l1.8 4.7L17.5 9.5l-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',ratio:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
zoom:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
vol:'<path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/>',
prev:'<path d="M6 5v14M18 5l-9 7 9 7z"/>',next:'<path d="M18 5v14M6 5l9 7-9 7z"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',
zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
fade:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
swap:'<path d="M7 8h12l-3-3M17 16H5l3 3"/>',none:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
zoomfx:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/>',
fit:'<path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/>',height:'<path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',overlay:'<rect x="3" y="7" width="12" height="12" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v10"/>',
vibrate:'<path d="M3 9v6M7 6v12M17 6v12M21 9v6"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
tv:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/>',
contrast:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 4h8v16H4z" fill="currentColor"/>',
coffee:'<path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
flip:'<path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/>',cine:'<rect x="2" y="6" width="20" height="12" rx="1"/><path d="M2 9h20M2 15h20"/>'};
P.gauge='<path d="M4 18a8 8 0 1 1 16 0M12 18l4-6"/>';P.filter='<circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/>';P.undo='<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>';P.redo='<path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/>';
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+P[n]+'</svg>';
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));

/* ===== ESTADO ===== */
const $=id=>document.getElementById(id), stage=$('stage'), tl=$('tl'), tr=$('trilho');
let items=[];            // todos os clipes: vídeo (k:'v') e áudio (k:'a')
let sel=null, trItem=null, gt=0, tocando=false, painel=null, PX=40, LH=44, uid=1, muteAll=false, addMode='main', exporting=false, novoAtivo=false, selGt=null, dragging=false;
const TOP=24, BOT=24;
const ADJ0={op:100,es:100,px:0,py:0,vo:100,br:0,ex:0,ct:0,sa:0,hu:0,te:0,so:0,re:0,pr:0,bn:0};
const TONE=['br','ex','ct','so','re','pr','bn','te'];

/* ===== EFEITOS E TRANSIÇÕES ===== */
const FX={
 glitch:{n:'Glitch',ic:'zap',f:g=>({css:'contrast(1.3) saturate(1.5) hue-rotate('+(((g*12|0)%3)*40)+'deg)',tx:((g*14|0)%4===0)?.02:0})},
 blur:{n:'Blur',ic:'drop',css:'blur(4px)'},
 fade:{n:'Fade',ic:'fade',css:'brightness(.6)',op:.8},
 tremor:{n:'Tremor',ic:'vibrate',f:g=>({tx:Math.sin(g*70)*.012,ty:Math.cos(g*83)*.012})},
 pulso:{n:'Pulso',ic:'pulse',f:g=>({sc:1+.06*Math.abs(Math.sin(g*6))})},
 vhs:{n:'VHS',ic:'tv',css:'saturate(1.4) contrast(1.15) blur(.6px) hue-rotate(-8deg)',f:g=>({tx:((g*9|0)%5===0)?.006:0})},
 pb:{n:'P&B',ic:'contrast',css:'grayscale(1) contrast(1.1)'},
 sepia:{n:'Sépia',ic:'coffee',css:'sepia(1)'},
 neg:{n:'Negativo',ic:'target',css:'invert(1)'},
 vintage:{n:'Vintage',ic:'film',css:'sepia(.5) contrast(1.1) saturate(1.3) hue-rotate(-10deg)'},
 neon:{n:'Neon',ic:'sparkles',css:'saturate(2.6) contrast(1.25) brightness(1.1)'},
 espelho:{n:'Espelho',ic:'flip',sx:-1},
 cinema:{n:'Cinema',ic:'cine',css:'contrast(1.2) saturate(.85) brightness(.92)'},
 flash:{n:'Flash',ic:'sun',f:g=>({css:'brightness('+(1+1.2*Math.pow(Math.max(0,Math.sin(g*5)),8))+')'})}
};
Object.assign(FX,{
 piscaR:{n:'Piscar rápido',ic:'zap',f:g=>({al:(g*10%2<1)?1:.08})},
 piscaL:{n:'Piscar devagar',ic:'sun',f:g=>({al:(g*2%2<1)?1:.08})},
 strobo:{n:'Strobo',ic:'contrast',f:g=>({css:((g*16|0)%2)?'invert(1)':''})},
 balanco:{n:'Balanço',ic:'swap',f:g=>({tx:Math.sin(g*3)*.04,sc:1.06})},

function aFxR(c,src,out,r,t0,dur){

  if(r.tr){const tg=c.createGain(),o=c.createOscillator(),og=c.createGain();o.type=r.tr[2]||'sine';tg.gain.value=1-r.tr[1]/2;o.frequency.value=r.tr[0];og.gain.value=r.tr[1]/2;o.connect(og);og.connect(tg.gain);st(o);n.connect(tg);n=tg;N.push(tg,o,og);}

const PKC=new Map();
function loadPeaks(it){
  if(it.k!=='a'||it.pk)return;
  if(!PKC.has(it.url))PKC.set(it.url,(async()=>{
    try{
      const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext,buf=await fetch(it.url).then(r=>r.arrayBuffer());
      const ab=await new Promise((ok,no)=>{const p=new AC(1,1,44100).decodeAudioData(buf,ok,no);if(p&&p.catch)p.catch(no);});
      const R=100,n=Math.max(1,Math.ceil(ab.duration*R)),pk=new Float32Array(n),sz=Math.max(1,Math.floor(ab.sampleRate/R));
      for(let c=0;c<ab.numberOfChannels;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++){let m=pk[i];const a=i*sz,b=Math.min(d.length,a+sz);for(let j=a;j<b;j+=2){const v=Math.abs(d[j]);if(v>m)m=v;}pk[i]=m;}}
      let mx=0;for(let i=0;i<n;i++)if(pk[i]>mx)mx=pk[i];if(mx>0)for(let i=0;i<n;i++)pk[i]/=mx;
      return pk;
    }catch(e){return null;}
  })());
  PKC.get(it.url).then(pk=>{it.pk=pk;if(pk)drawWave(it);});
}
function drawWave(it){
  const d=it._d;if(!d||!it.pk)return;
  let c=d.querySelector('canvas.wf');if(!c){c=document.createElement('canvas');c.className='wf';d.insertBefore(c,d.firstChild);}
  const w=Math.min(2400,Math.max(8,Math.round(len(it)*PX))),h=Math.max(10,LH-10),x=(c.width=w,c.height=h,c.getContext('2d'));x.fillStyle='#22d3ee';
  for(let i=0;i<w;i++){
    const a=Math.floor((it.ini+i/w*len(it))*100),b=Math.max(a+1,Math.floor((it.ini+(i+1)/w*len(it))*100));
    let m=0;for(let j=a;j<b&&j<it.pk.length;j++)if(it.pk[j]>m)m=it.pk[j];
    const bh=Math.max(1,m*h);x.fillRect(i,(h-bh)/2,1,bh);
  }
}

function curve(a,ch){
  const v=[],cl=x=>Math.min(1,Math.max(0,x));
  for(let i=0;i<=32;i++){
    let x=i/32; x*=Math.pow(2,a.ex/100); x+=a.br/200; x=cl((x-.5)*(1+a.ct/100)+.5);
    x+=.25*a.so/100*Math.pow(1-x,2)+.25*a.re/100*x*x+.2*a.pr/100*Math.pow(1-x,5)+.2*a.bn/100*Math.pow(x,5);
    if(ch==='R')x*=1+a.te/400; if(ch==='B')x*=1-a.te/400;
    v.push(cl(x).toFixed(3));
  }
  return v.join(' ');
}

const LOOK=4.5,MAXAW=8;let _mg=0,_mt=null;
function wake(it){
  if(it._ld)return;it._ld=true;const el=it.el;el.preload='auto';el.src=it.url;
  el.addEventListener('loadedmetadata',()=>{try{el.currentTime=Math.max(0,Math.min(it.dur,it.ini+Math.max(0,gt-it.s)*(it.sp||1)));}catch(e){}},{once:true});
}
function nap(it){if(!it._ld)return;it._ld=false;const el=it.el;el.pause();el.removeAttribute('src');el.load();}
function manage(force){
  if(exporting||novoAtivo){items.forEach(wake);return;}
  const n=performance.now();
  if(!force&&n-_mg<150){if(!_mt)_mt=setTimeout(()=>{_mt=null;manage(true);},170);return;}
  _mg=n;
  items.forEach(it=>{const lt=gt-it.s,L=len(it);it._dist=lt<0?-lt:lt>L?lt-L:0;});
  [items.filter(i=>i.k==='v'),items.filter(i=>i.k==='a')].forEach(g=>{
    g.sort((a,b)=>a._dist-b._dist).forEach((it,i)=>{
      if(i<MAXAW&&it._dist<=(it.k==='v'?LOOK:LOOK*2))wake(it);
      else if(it._dist>LOOK+5||i>=MAXAW+2)nap(it);

  });
}

/* ===== VISUAL DE CADA CLIPE (efeito + ajustes + transição) ===== */
function trans(L,t,a,dir){
  if(t==='fade'||t==='white'){L.alpha*=1-a;L.bg=t==='fade'?'#000':'#fff';}
  else if(t==='zoom'){L.sc*=1+.4*a;L.alpha*=1-a;}
  else L.tx+=-dir*a;
}
function look(it,g,m){
  const a=it.adj, lt=g-it.s, L={css:'',sc:a.es/100,tx:a.px/100,ty:a.py/100,sx:1,alpha:a.op/100,bg:null};
  const f=it.fx&&FX[it.fx];
  if(f){
    if(f.css)L.css+=f.css+' '; if(f.op)L.alpha*=f.op; if(f.sx)L.sx=f.sx;
    if(f.f){const r=f.f(g);if(r.al!=null)L.alpha*=r.al;if(r.css)L.css+=r.css+' ';L.tx+=r.tx||0;L.ty+=r.ty||0;L.sc*=r.sc||1;}
  }
  const i=m.indexOf(it);
  if(i>=0){
    const n=m[i+1],p=m[i-1];
    if(it.tr&&n){const h=Math.min(it.tr.d/2,len(it)/2),rest=len(it)-lt;if(rest<h)trans(L,it.tr.t,1-rest/h,1);}
    if(p&&p.tr){const h=Math.min(p.tr.d/2,len(it)/2);if(lt<h)trans(L,p.tr.t,1-lt/h,-1);}
  }
  if(it.vfi>0)L.alpha*=Math.max(0,Math.min(1,lt/it.vfi));if(it.vfo>0)L.alpha*=Math.max(0,Math.min(1,(len(it)-lt)/it.vfo));
  L.filter=(tonal(a)?'url(#f'+it.id+') ':'')+(a.sa?'saturate('+(1+a.sa/100)+') ':'')+(a.hu?'hue-rotate('+a.hu*1.8+'deg) ':'')+(it.flt&&FLT[it.flt]?FLT[it.flt].css+' ':'')+L.css;
  return L;
}

/* ===== EMENDA SEM COSTURA (clipes divididos) =====
   Quando o próximo clipe é a continuação exata do anterior (mesmo arquivo, início = fim do anterior),
   ele ASSUME o mesmo <video> que já está tocando, sem buscar posição nem dar play de novo.
   Antes, dois elementos se revezavam no mesmo trecho: o 1º ainda soltava áudio/quadros do começo do 2º
   e o 2º demorava a arrancar = trecho repetido ("CD riscado"). */
function succ(it){return items.find(o=>o!==it&&o.k===it.k&&o.url===it.url&&o.ly===it.ly&&Math.abs(o.s-(it.s+len(it)))<.03&&Math.abs(o.ini-it.fim)<.03);}
function adopt(it){
  const lt=gt-it.s;
  if(it._on||!(lt>=0&&lt<.5&&lt<len(it)))return;
  const d=items.find(o=>o!==it&&o.k===it.k&&o._on&&o._ld&&o.url===it.url&&o.ly===it.ly&&!(gt>=o.s&&gt<o.s+len(o))
    &&Math.abs(o.s+len(o)-it.s)<.03&&Math.abs(o.fim-it.ini)<.03
    &&!o.el.paused&&!o.el.ended&&!o.el.seeking&&o.el.readyState>=2&&Math.abs(o.el.currentTime-(it.ini+lt*(it.sp||1)))<.35);

let hist=[{st:'[]',sel:null}],hi=0;
const snapSt=()=>JSON.stringify(items.map(i=>({k:i.k,id:i.id,url:i.url,nome:i.nome,dur:i.dur,ini:i.ini,fim:i.fim,s:i.s,ly:i.ly,vol:i.vol,afx:i.afx,w:i.w,h:i.h,fx:i.fx,tr:i.tr,adj:i.adj,sp:i.sp,flt:i.flt,fi:i.fi,fo:i.fo,mu:i.mu,vfi:i.vfi,vfo:i.vfo})));

let cancelou=false,rec=null,chunks=[],actx=null,dest=null,outG=null,mime='',exportTrack=null,exportToken=0;
const cv=$('cv'),ctx=cv.getContext('2d'),expThumb=$('expThumb'),expCtx=$('expThumb').getContext('2d');
function exportProgress(){
  const pct=Math.max(0,Math.min(100,Math.round(gt/Math.max(total(),.1)*100)));
  $('barra').firstChild.style.width=pct+'%';$('expPercent').textContent=pct+'%';$('expFill').style.height=pct+'%';
  if(expThumb.width!==cv.width||expThumb.height!==cv.height){expThumb.width=cv.width;expThumb.height=cv.height;}
  try{expCtx.clearRect(0,0,expThumb.width,expThumb.height);expCtx.drawImage(cv,0,0,expThumb.width,expThumb.height);}catch(e){}
}
function ligaAudio(el){if(el._n)return;el._n=actx.createMediaElementSource(el);el._n.connect(dest);el._n.connect(outG);}
function drawFrame(){
  const W=cv.width,H=cv.height;
  ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle=curBg;ctx.fillRect(0,0,W,H);
  items.filter(i=>i.k==='v'&&i._on).sort((a,b)=>a.ly-b.ly).forEach(it=>{
    const vw=it.el.videoWidth,vh=it.el.videoHeight,L=it._L;if(!vw||!vh)return;
    const sc=Math.min(W/vw,H/vh),dw=vw*sc,dh=vh*sc;
    ctx.save();ctx.globalAlpha=L.alpha;ctx.filter=(L.filter||'none').replace(/url\([^)]*\)/g,'').trim()||'none';
    ctx.translate(W/2+L.tx*W,H/2+L.ty*H);ctx.scale(L.sc*L.sx,L.sc);
    ctx.drawImage(it.el,-dw/2,-dh/2,dw,dh);ctx.restore();
  });
}
function waitEvent(el,name,timeout=1800){
  return new Promise(resolve=>{
    let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(timer);el.removeEventListener(name,finish);resolve();};
    const timer=setTimeout(finish,timeout);el.addEventListener(name,finish,{once:true});
  });
}
async function waitVideoFrame(el){
  if(el.seeking)await waitEvent(el,'seeked',1800);
  if(el.readyState<2)await Promise.race([waitEvent(el,'loadeddata',1800),waitEvent(el,'canplay',1800)]);
  if(el.requestVideoFrameCallback){
    await Promise.race([new Promise(resolve=>{try{el.requestVideoFrameCallback(()=>resolve());}catch(e){resolve();}}),new Promise(resolve=>setTimeout(resolve,900))]);
  }else await new Promise(resolve=>setTimeout(resolve,34));
}
async function exportLoop(token){
  const end=total(),fps=30,step=1/fps;
  let last=performance.now(),next=0;
  while(token===exportToken&&!cancelou&&gt<end){
    const now=performance.now();
    const elapsed=Math.max(step,Math.min(.15,(now-last)/1000));last=now;
    gt=Math.min(end,gt+elapsed);
    frame();
    const active=items.filter(i=>i.k==='v'&&i._on);
    if(active.length)await Promise.all(active.map(i=>waitVideoFrame(i.el)));
    else await new Promise(resolve=>setTimeout(resolve,step*1000));
    if(token!==exportToken||cancelou)break;
    // Recalcula o ponto após a decodificação para não gravar o quadro antigo
    const after=performance.now(),extra=Math.max(0,Math.min(.1,(after-last)/1000));last=after;
    if(extra){gt=Math.min(end,gt+extra);frame();}
    drawFrame();if(exportTrack&&exportTrack.requestFrame)exportTrack.requestFrame();
    exportProgress();
    next+=step;
  }
  if(token===exportToken&&!cancelou){
    gt=end;frame();const active=items.filter(i=>i.k==='v'&&i._on);
    if(active.length)await Promise.all(active.map(i=>waitVideoFrame(i.el)));
    drawFrame();if(exportTrack&&exportTrack.requestFrame)exportTrack.requestFrame();
    setTimeout(()=>finalizaExport(),120);
  }
}
async function exportarLegacy(){
  const base=main()[0]||items.find(i=>i.k==='v');
  if(!base)return toast('Adicione um vídeo primeiro');
  if(!window.MediaRecorder)return toast('Seu navegador não suporta exportação');
  pause();
  mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime)return toast('Formato de exportação não suportado');
  try{
    if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();dest=actx.createMediaStreamDestination();outG=actx.createGain();outG.connect(actx.destination);}
    await actx.resume();items.forEach(i=>ligaAudio(i.el));outG.gain.value=0;
    const k=Math.min(1,1280/Math.max(base.w||1280,base.h||720));
    cv.width=Math.max(2,Math.round((base.w||1280)*k/2)*2);cv.height=Math.max(2,Math.round((base.h||720)*k/2)*2);
    let stream=cv.captureStream(0);exportTrack=stream.getVideoTracks()[0];
    if(!exportTrack||!exportTrack.requestFrame){stream=cv.captureStream(30);exportTrack=stream.getVideoTracks()[0];}
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:192000});
    chunks=[];cancelou=false;exportToken++;
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onerror=e=>{cancelou=true;exporting=false;pause();toast('Erro ao codificar o vídeo');};
    rec.onstop=()=>{
      exporting=false;outG.gain.value=1;$('exp').style.display='none';pause();frame();
      if(cancelou)return toast('Exportação cancelada');
      const blob=new Blob(chunks,{type:mime.split(';')[0]});
      if(!blob.size)return toast('A exportação não gerou um arquivo válido');
      const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;
      a.download='mappa-video.'+(mime.includes('mp4')?'mp4':'webm');a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Vídeo exportado!');
    };
    exporting=true;$('exp').style.display='flex';$('barra').firstChild.style.width='0';$('expFill').style.height='0';$('expPercent').textContent='0%';
    await wakeAll();gt=0;tocando=true;$('bPlay').innerHTML=ic('pause');frame();
    // Aguarda o primeiro quadro real antes de iniciar a gravação.
    const active=items.filter(i=>i.k==='v'&&i._on);
    if(active.length)await Promise.all(active.map(i=>waitVideoFrame(i.el)));
    drawFrame();exportProgress();rec.start();if(exportTrack&&exportTrack.requestFrame)exportTrack.requestFrame();
    exportLoop(exportToken);
  }catch(err){
    exporting=false;outG&& (outG.gain.value=1);pause();$('exp').style.display='none';
    console.error(err);toast('Não foi possível iniciar a exportação');
  }
}

/* ===== EXPORTAR v2: quadro a quadro (WebCodecs + MP4) =====
   Não depende de tempo real: cada quadro é posicionado, decodificado e só então
   desenhado e codificado com timestamp exato. Se o aparelho demorar, a exportação
   só leva mais tempo — o vídeo nunca trava. O áudio é mixado à parte (OfflineAudioContext). */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let _rvMiss=0,_rvOff=false;
function seekExato(el,want){
  return new Promise(resolve=>{
    if(!el.seeking&&el.readyState>=2&&Math.abs(el.currentTime-want)<.004)return resolve();
    let ok=false,rv=null;
    const fim=()=>{if(ok)return;ok=true;clearTimeout(tm);el.removeEventListener('seeked',onS);resolve();};
    const onS=async()=>{
      if(rv){const r=await Promise.race([rv.then(()=>1),sleep(60).then(()=>0)]);if(r)_rvMiss=0;else if(++_rvMiss>=4)_rvOff=true;}   // se o aparelho não avisa o quadro, para de esperar à toa
      else await sleep(6);
      fim();};
    const tm=setTimeout(fim,5000);
    if(el.requestVideoFrameCallback&&!_rvOff)rv=new Promise(r=>{try{el.requestVideoFrameCallback(()=>r());}catch(e){r();}});
    el.addEventListener('seeked',onS,{once:true});
    try{el.currentTime=want;}catch(e){fim();}
  });
}
function applyAudioFx(off,src,gain,fx,duration,startAt){

    const f=off.createBiquadFilter();f.type='bandpass';f.frequency.value=fx==='phone'?1250:900;f.Q.value=fx==='phone'?0.8:0.55;connect(src,f);connect(f,gain);

  }else if(fx==='reverb'){
    const con=off.createConvolver(),imp=off.createBuffer(2,Math.floor(off.sampleRate*2.8),off.sampleRate);
    for(let c=0;c<2;c++){const d=imp.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.8);}
    con.buffer=imp;const wet=off.createGain();wet.gain.value=.55;connect(src,con);connect(con,wet);connect(wet,gain);
    return {input:src,output:gain};
  }else if(fx==='tape'){
    src.playbackRate.setValueAtTime(1,startAt);src.playbackRate.linearRampToValueAtTime(.35,startAt+Math.min(1,duration));
  }else if(fx==='dreamy'){src.playbackRate.value=1.08;}
  else if(fx==='stutter'||fx==='cyber'){
    const gate=off.createGain();gate.gain.setValueAtTime(1,startAt);
    const step=fx==='stutter'?.105:.075;
    for(let t=startAt+Math.max(.15,duration*.55);t<startAt+duration;t+=step*2){gate.gain.setValueAtTime(0,t);gate.gain.setValueAtTime(1,t+step*.55);}
    connect(src,gate);connect(gate,gain);
  }else connect(src,gain);
  if(fx==='phone'||fx==='cyber'||fx==='lofi'){
    const noise=off.createBufferSource(),b=off.createBuffer(1,Math.ceil(off.sampleRate*duration),off.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.012;
    noise.buffer=b;const ng=off.createGain();ng.gain.value=fx==='phone'?.035:.012;noise.connect(ng);ng.connect(off.destination);noise.start(startAt);
  }
  return {input:src,output:gain};
}
async function renderAudio(end,sr){
  const off=new OfflineAudioContext(2,Math.max(1,Math.ceil(end*sr)),sr),cache=new Map();let any=false;
  for(const it of items){
    const vol=it.k==='v'?Math.min(1,it.adj.vo/100):it.vol; if(!vol||it.mu)continue;
    try{
      if(!cache.has(it.url))cache.set(it.url,fetch(it.url).then(r=>r.arrayBuffer()).then(b=>off.decodeAudioData(b)).catch(()=>null));
      const buf=await cache.get(it.url); if(!buf)continue;
      const src=off.createBufferSource(),g=off.createGain();src.buffer=buf;g.gain.value=vol;
      if(it.fi>0){g.gain.setValueAtTime(0,it.s);g.gain.linearRampToValueAtTime(vol,it.s+it.fi);}
      if(it.fo>0){const e=it.s+len(it);g.gain.setValueAtTime(vol,Math.max(it.s+(it.fi||0),e-it.fo));g.gain.linearRampToValueAtTime(0,e);}
      if(it.afx==='tape')src.playbackRate.setValueAtTime(1,it.s);
      const fx=applyAudioFx(off,src,g,it.afx,len(it),it.s);fx.output.connect(off.destination);
      if(it.sp&&it.sp!==1&&it.afx!=='tape'&&it.afx!=='dreamy')src.playbackRate.value=it.sp;src.start(it.s,it.ini,len(it)*(it.sp||1));any=true;
    }catch(e){}
  }
  return any?await off.startRendering():null;
}
async function encodeAudio(buf,aenc,token){
  const sr=buf.sampleRate,n=buf.length,L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L,CH=4096;
  for(let o=0;o<n;o+=CH){
    if(cancelou||token!==exportToken)throw 'cancel';
    const m=Math.min(CH,n-o),d=new Float32Array(m*2);d.set(L.subarray(o,o+m),0);d.set(R.subarray(o,o+m),m);
    const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:m,numberOfChannels:2,timestamp:Math.round(o/sr*1e6),data:d});
    aenc.encode(ad);ad.close();
    while(aenc.encodeQueueSize>24)await sleep(4);
  }
  await aenc.flush();
}
async function exportar(){
  if(!(window.VideoEncoder&&window.VideoFrame&&window.AudioEncoder&&window.AudioData&&window.Mp4Muxer&&window.OfflineAudioContext))return exportarLegacy();
  const base=main()[0]||items.find(i=>i.k==='v');
  if(!base)return toast('Adicione um vídeo primeiro');
  pause();
  const end=total(),fps=30,N=Math.max(1,Math.ceil(end*fps-1e-6)),SR=48000;
  const k=Math.min(1,1280/Math.max(base.w||1280,base.h||720));
  const W=Math.max(2,Math.round((base.w||1280)*k/2)*2),H=Math.max(2,Math.round((base.h||720)*k/2)*2);
  const bps=Math.round(Math.max(2e6,Math.min(12e6,W*H*fps*.25)));
  let vcfg=null;
  for(const codec of ['avc1.640028','avc1.4d0028','avc1.42001f']){
    const c={codec,width:W,height:H,bitrate:bps,framerate:fps,avc:{format:'avc'}};
    try{if((await VideoEncoder.isConfigSupported(c)).supported){vcfg=c;break;}}catch(e){}
  }
  if(!vcfg)return exportarLegacy();
  cv.width=W;cv.height=H;
  novoAtivo=true;exporting=true;tocando=false;cancelou=false;const token=++exportToken;
  const lbl=$('exp').querySelector('p');lbl.textContent='Preparando áudio…';
  $('exp').style.display='flex';$('barra').firstChild.style.width='0';$('expFill').style.height='0';$('expPercent').textContent='0%';
  let wl=null,venc=null,aenc=null,erro=null;
  try{wl=await navigator.wakeLock.request('screen');}catch(e){}
  try{
    _rvMiss=0;_rvOff=false;
    await wakeAll();
    const abufP=renderAudio(end,SR).catch(()=>null);   // decodifica o áudio enquanto os quadros são gerados
    const vq=[];
    venc=new VideoEncoder({output:(c,m)=>vq.push([c,m]),error:e=>{erro=e;}});
    venc.configure(vcfg);
    lbl.textContent='Exportando vídeo…';
    for(let i=0;i<N;i++){
      if(cancelou||token!==exportToken)throw 'cancel';
      if(erro)throw erro;
      gt=Math.min(end-1e-4,i/fps);
      frame();                                   // calcula visibilidade, efeitos e transições deste instante
      const act=items.filter(it=>it.k==='v'&&it._on);
      await Promise.all(act.map(it=>seekExato(it.el,Math.min(Math.max(0,it.dur-.034),Math.max(0,it.ini+(gt-it.s)*(it.sp||1))))));
      drawFrame();
      const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
      venc.encode(vf,{keyFrame:i%60===0});vf.close();
      while(venc.encodeQueueSize>6)await sleep(4);
      if(i%3===0){exportProgress();await sleep(0);}
    }
    await venc.flush();
    lbl.textContent='Finalizando…';
    const abuf=await abufP;
    if(cancelou||token!==exportToken)throw 'cancel';
    let acfg=null;
    if(abuf)for(const codec of ['mp4a.40.2','opus']){
      const c={codec,sampleRate:SR,numberOfChannels:2,bitrate:128000};
      try{if((await AudioEncoder.isConfigSupported(c)).supported){acfg=c;break;}}catch(e){}
    }
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},
      ...(acfg?{audio:{codec:acfg.codec==='opus'?'opus':'aac',numberOfChannels:2,sampleRate:SR}}:{}),fastStart:'in-memory'});
    for(const [c,m] of vq)muxer.addVideoChunk(c,m);
    if(abuf&&acfg){
      aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{erro=e;}});
      aenc.configure(acfg);await encodeAudio(abuf,aenc,token);
    }
    if(erro)throw erro;
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='mappa-video.mp4';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast('Vídeo exportado!');
  }catch(e){
    if(e==='cancel')toast('Exportação cancelada');
    else{console.error(e);toast('Erro na exportação: '+((e&&e.message)||e));}
  }finally{
    try{if(venc&&venc.state!=='closed')venc.close();}catch(_){}
    try{if(aenc&&aenc.state!=='closed')aenc.close();}catch(_){}
    try{if(wl)wl.release();}catch(_){}
    exporting=false;novoAtivo=false;$('exp').style.display='none';
    gt=0;frame();updUI();scrollTimeline(0);
  }
}

$('btnExp').onclick=exportar;
$('cancelar').onclick=()=>{cancelou=true;exportToken++;if(novoAtivo)return;pause();finalizaExport();};
render();updHist();
window.addEventListener('resize',()=>{layout();});
</script>

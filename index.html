<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e14">
<title>Mappa Editor v4.1</title>
<style>
:root{--bg:#0e0e14;--panel:#181822;--panel2:#22222f;--line:#33334a;--txt:#ecebf5;--mut:#9a98b3;--pur:#8b5cf6;--purl:#c4b5fd;--yel:#facc15;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.hide{display:none!important}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
h1{font-size:16px;margin:0}h1 span{color:var(--pur)}
.tot{font-size:13px;color:var(--mut)}.tot b{color:var(--txt);font-variant-numeric:tabular-nums}
#stage{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;display:none}
#stage.has video{display:block}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mut);font-size:15px}
#stage.has .empty{display:none}
#bigPlay{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:26px;display:none;align-items:center;justify-content:center}
#stage.has #bigPlay{display:flex}
#stage.playing #bigPlay{display:none}
.ov{position:absolute;left:8px;right:8px;bottom:8px;display:none;justify-content:space-between;align-items:center;pointer-events:none}
#stage.has .ov{display:flex}
.ov button{pointer-events:auto;min-height:40px;padding:0 12px;border-radius:20px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.ov span{background:rgba(0,0,0,.55);padding:6px 10px;border-radius:20px;font-size:12px;font-variant-numeric:tabular-nums}
#tl{flex:none;position:relative;display:flex;align-items:center;gap:8px;padding:10px 8px;background:var(--panel);border-top:1px solid var(--line)}
#plus{flex:none;width:48px;height:48px;border-radius:12px;border:0;background:var(--pur);color:#fff;font-size:30px;line-height:1}
.scroll{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.track{display:flex;gap:3px;width:max-content;min-width:100%;height:60px;user-select:none;-webkit-user-select:none}
.clip{position:relative;height:60px;border-radius:8px;background:#2d2650;border:2px solid transparent;display:flex;overflow:hidden;flex:none}
.clip.sel{border-color:var(--pur);background:#3b2f73}
.clip .body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.clip .body b{font-size:12px}.clip .body span{font-size:11px;color:var(--mut)}
.h{flex:none;width:22px;touch-action:none;cursor:ew-resize;display:flex;align-items:center;justify-content:center}
.h::after{content:"";width:4px;height:26px;border-radius:2px;background:currentColor}
.hl{color:var(--purl);background:rgba(196,181,253,.25)}
.hr{color:var(--yel);background:rgba(250,204,21,.25)}
.tlempty{color:var(--mut);font-size:13px;display:flex;align-items:center;height:60px}
#menu{position:absolute;left:8px;bottom:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#menu button{min-height:46px;border:0;background:none;color:var(--txt);text-align:left;font-size:15px;padding:0 12px;border-radius:8px}
#menu button:active{background:var(--line)}
#trim{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px 4px}
.sl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.sl b{color:var(--txt);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;margin:2px 0}
#sS{accent-color:var(--purl)}#sE{accent-color:var(--yel)}
#bar{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px}
#bar>div{display:flex;gap:6px;overflow-x:auto}
#bar button{flex:none;min-width:76px;min-height:56px;border:0;border-radius:10px;background:none;color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;font-family:inherit}
#bar button small{font-size:11px;color:var(--mut)}
#bar button:disabled{opacity:.35}
#bar button.on{background:var(--panel2)}
#bDel{color:#fca5a5}
input[type=file]{display:none}
#msg{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0));max-width:500px;margin:0 auto;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px;display:none;z-index:9}
#msg.err{border-color:var(--red);color:#fecaca}#msg.load{border-color:var(--pur)}
</style>
</head>
<body>
<div id="app">
  <header><h1>Mappa <span>Editor</span></h1><span class="tot">Total <b id="total">0:00.0</b></span></header>

  <div id="stage">
    <video id="vid" playsinline preload="metadata"></video>
    <div class="empty">Toque em + para adicionar vídeos</div>
    <button id="bigPlay" aria-label="Reproduzir">▶</button>
    <div class="ov"><button id="bStart">⏮ Início do trecho</button><span id="pos">0:00.0 / 0:00.0</span></div>
  </div>

  <div id="tl">
    <button id="plus" aria-label="Adicionar vídeos">+</button>
    <div class="scroll"><div class="track" id="track"></div></div>
    <div id="menu" class="hide">
      <button id="mGal">🖼 Da galeria</button>
      <button id="mFiles">📁 Dos arquivos</button>
    </div>
  </div>

  <div id="trim" class="hide">
    <div class="sl"><label><span>Início do clipe</span><b id="vS">0:00.0</b></label><input type="range" id="sS" min="0" max="1" step="0.1" value="0"></div>
    <div class="sl"><label><span>Fim do clipe</span><b id="vE">0:00.0</b></label><input type="range" id="sE" min="0" max="1" step="0.1" value="1"></div>
  </div>

  <nav id="bar">
    <div id="barMain"><button id="bAj">⚙<small>Ajustes</small></button><button id="bDel" disabled>🗑<small>Excluir</small></button></div>
    <div id="barAj" class="hide"><button id="bBack">‹<small>Voltar</small></button><button id="bTrim" disabled>✂<small>Ajuste de trecho</small></button></div>
  </nav>

  <input id="fileG" type="file" accept="video/*" multiple>
  <input id="fileA" type="file" multiple>
</div>
<div id="msg"></div>

<script>
(function(){
'use strict';
var MIN=0.5, PPS=40, MINW=84;
var clips=[], selId=null, nextId=1, drag=null, raf=0, msgTimer=0, trimOpen=false;
var $=function(s){return document.querySelector(s)};
var vid=$('#vid'),track=$('#track'),stage=$('#stage');
var sS=$('#sS'),sE=$('#sE');

function fmt(t){t=Math.max(0,t);var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function kept(c){return c.end-c.start}
function total(){return clips.reduce(function(a,c){return a+kept(c)},0)}
function get(id){for(var i=0;i<clips.length;i++)if(clips[i].id===id)return clips[i];return null}
function sel(){return get(selId)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function say(t,type,ms){var m=$('#msg');m.textContent=t;m.className=type||'';m.style.display='block';clearTimeout(msgTimer);if(ms)msgTimer=setTimeout(function(){m.style.display='none'},ms)}
function hideMsg(){clearTimeout(msgTimer);$('#msg').style.display='none'}

// ===== Importação =====
function probe(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),v=document.createElement('video'),done=false,t;
    function fin(err,d){
      if(done)return;done=true;clearTimeout(t);
      v.removeAttribute('src');v.load();
      if(err){URL.revokeObjectURL(url);rej(err)}else res({url:url,duration:d});
    }
    t=setTimeout(function(){fin(new Error('tempo esgotado'))},40000);
    v.preload='metadata';v.muted=true;
    v.onloadedmetadata=function(){var d=v.duration;(isFinite(d)&&d>0)?fin(null,d):fin(new Error('duração inválida'))};
    v.onerror=function(){fin(new Error('formato não suportado'))};
    v.src=url;
  });
}
var queue=Promise.resolve();
function addFiles(files){queue=queue.then(function(){return runAdd(files)}).catch(function(){});return queue}
async function runAdd(files){
  var n=files.length,ok=0,bad=[];
  for(var i=0;i<n;i++){
    var f=files[i];
    say('Carregando '+(i+1)+' de '+n+'…','load');
    try{
      var p=await probe(f);
      var c={id:'c'+(nextId++),name:f.name||'vídeo',url:p.url,duration:p.duration,start:0,end:p.duration};
      clips.push(c);ok++;
      buildTimeline();if(!selId)select(c.id);else update();
    }catch(e){bad.push(f.name+' ('+(e&&e.message?e.message:'erro')+')')}
  }
  if(bad.length)say('Adicionados '+ok+' de '+n+'. Falharam: '+bad.join(', '),'err',8000);
  else say(ok+' vídeo(s) adicionado(s).','',2000);
}
function onPick(e){var inp=e.target,f=Array.prototype.slice.call(inp.files||[]);inp.value='';if(f.length)addFiles(f)}
$('#fileG').addEventListener('change',onPick);
$('#fileA').addEventListener('change',onPick);

// ===== Menu do + =====
var menu=$('#menu');
function toggleMenu(show){menu.classList.toggle('hide',show===undefined?!menu.classList.contains('hide')?true:false:!show)}
$('#plus').addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('hide')});
$('#mGal').addEventListener('click',function(){menu.classList.add('hide');$('#fileG').click()});
$('#mFiles').addEventListener('click',function(){menu.classList.add('hide');$('#fileA').click()});
document.addEventListener('click',function(e){if(!e.target.closest('#menu'))menu.classList.add('hide')});

// ===== Seleção e exclusão =====
function select(id){
  selId=id;var c=sel();
  if(c&&vid.dataset.id!==c.id){vid.pause();vid.dataset.id=c.id;vid.src=c.url}
  update();
}
function removeClip(id){
  var i=clips.findIndex(function(c){return c.id===id});if(i<0)return;
  var c=clips[i];clips.splice(i,1);
  if(drag&&drag.id===id)drag=null;
  if(vid.dataset.id===id){vid.pause();vid.removeAttribute('src');vid.removeAttribute('data-id');vid.load()}
  URL.revokeObjectURL(c.url);
  if(selId===id){selId=null;var nx=clips[i]||clips[i-1];if(nx)selId=nx.id}
  buildTimeline();
  if(selId)select(selId);else update();
}

// ===== Edição =====
function setStart(c,v){c.start=clamp(v,0,c.end-Math.min(MIN,c.duration));seekPreview(c,'s');update()}
function setEnd(c,v){c.end=clamp(v,c.start+Math.min(MIN,c.duration),c.duration);seekPreview(c,'e');update()}
function seekPreview(c,w){
  if(c.id!==selId||vid.readyState<1||!vid.paused)return;
  vid.currentTime=w==='s'?c.start:Math.max(c.start,c.end-0.05);
}

// ===== Linha do tempo =====
function buildTimeline(){
  track.innerHTML='';
  if(!clips.length){track.innerHTML='<div class="tlempty">Sem clipes</div>';return}
  clips.forEach(function(c,i){
    var d=document.createElement('div');d.className='clip';d.dataset.id=c.id;
    d.innerHTML='<div class="h hl" data-h="s"></div><div class="body"><b>'+(i+1)+'</b><span></span></div><div class="h hr" data-h="e"></div>';
    track.appendChild(d);
  });
}
function update(){
  var c=sel(),has=!!c;
  Array.prototype.forEach.call(track.querySelectorAll('.clip'),function(el,i){
    var k=get(el.dataset.id);if(!k)return;
    el.style.width=Math.max(MINW,kept(k)*PPS)+'px';
    el.querySelector('span').textContent=fmt(kept(k));
    el.querySelector('b').textContent=i+1;
    el.classList.toggle('sel',k.id===selId);
  });
  $('#total').textContent=fmt(total());
  stage.classList.toggle('has',has);
  stage.classList.toggle('playing',has&&!vid.paused);
  $('#bDel').disabled=!has;$('#bTrim').disabled=!has;
  if(!has&&trimOpen)setTrim(false);
  if(has){
    sS.max=sE.max=c.duration;sS.value=c.start;sE.value=c.end;
    $('#vS').textContent=fmt(c.start);$('#vE').textContent=fmt(c.end);
  }
  updPos();
}
function updPos(){
  var c=sel();if(!c){$('#pos').textContent='0:00.0 / 0:00.0';return}
  var p=vid.readyState>0?clamp(vid.currentTime-c.start,0,kept(c)):0;
  $('#pos').textContent=fmt(p)+' / '+fmt(kept(c));
}

// ===== Alças (pointer events) =====
track.addEventListener('pointerdown',function(e){
  var h=e.target.closest('.h');
  if(h){
    var c=get(h.parentNode.dataset.id);if(!c)return;
    e.preventDefault();
    if(selId!==c.id)select(c.id);
    drag={id:c.id,w:h.dataset.h,x:e.clientX,s:c.start,e:c.end,pid:e.pointerId};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    return;
  }
  var cl=e.target.closest('.clip');
  if(cl&&cl.dataset.id!==selId)select(cl.dataset.id);
});
track.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  e.preventDefault();
  var c=get(drag.id);if(!c){drag=null;return}
  var dt=(e.clientX-drag.x)/PPS;
  if(drag.w==='e')setEnd(c,drag.e+dt);else setStart(c,drag.s+dt);
});
function endDrag(e){if(drag&&e.pointerId===drag.pid)drag=null}
track.addEventListener('pointerup',endDrag);
track.addEventListener('pointercancel',endDrag);
track.addEventListener('lostpointercapture',endDrag);
track.addEventListener('contextmenu',function(e){e.preventDefault()});

// ===== Barra de botões =====
function setTrim(on){trimOpen=on;$('#trim').classList.toggle('hide',!on);$('#bTrim').classList.toggle('on',on)}
$('#bAj').addEventListener('click',function(){$('#barMain').classList.add('hide');$('#barAj').classList.remove('hide')});
$('#bBack').addEventListener('click',function(){setTrim(false);$('#barAj').classList.add('hide');$('#barMain').classList.remove('hide')});
$('#bTrim').addEventListener('click',function(){if(sel())setTrim(!trimOpen)});
$('#bDel').addEventListener('click',function(){if(selId)removeClip(selId)});
sS.addEventListener('input',function(){var c=sel();if(c)setStart(c,parseFloat(sS.value))});
sE.addEventListener('input',function(){var c=sel();if(c)setEnd(c,parseFloat(sE.value))});

// ===== Reprodução =====
function togglePlay(){
  var c=sel();if(!c){menu.classList.remove('hide');return}
  if(vid.paused){var p=vid.play();if(p&&p.catch)p.catch(function(){say('Não foi possível reproduzir este vídeo.','err',4000)})}
  else vid.pause();
}
$('#bigPlay').addEventListener('click',function(e){e.stopPropagation();togglePlay()});
stage.addEventListener('click',function(e){if(e.target.closest('button'))return;togglePlay()});
$('#bStart').addEventListener('click',function(e){e.stopPropagation();var c=sel();if(c&&vid.readyState>0){vid.currentTime=c.start;updPos()}});
vid.addEventListener('loadedmetadata',function(){var c=sel();if(c&&vid.dataset.id===c.id){vid.currentTime=c.start;updPos()}});
vid.addEventListener('seeked',updPos);
vid.addEventListener('timeupdate',updPos);
vid.addEventListener('error',function(){if(vid.getAttribute('src'))say('Erro ao carregar o vídeo selecionado.','err',4000)});
vid.addEventListener('play',function(){
  var c=sel();if(c&&(vid.currentTime<c.start-0.05||vid.currentTime>=c.end-0.05))vid.currentTime=c.start;
  cancelAnimationFrame(raf);loop();update();
});
vid.addEventListener('pause',function(){cancelAnimationFrame(raf);update()});
vid.addEventListener('ended',function(){var c=sel();if(c)vid.currentTime=c.start});
function loop(){
  var c=sel();
  if(c&&!vid.paused&&vid.currentTime>=c.end-0.03){vid.pause();vid.currentTime=c.start;return}
  if(c&&!vid.paused&&vid.currentTime<c.start-0.2)vid.currentTime=c.start;
  updPos();raf=requestAnimationFrame(loop);
}

window.addEventListener('beforeunload',function(){clips.forEach(function(c){URL.revokeObjectURL(c.url)})});
buildTimeline();update();
})();
</script>
</body>
</html>

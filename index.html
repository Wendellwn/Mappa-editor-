<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappa Editor v4.8</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
/* ===== CORES (mude aqui) ===== */
:root{--bg:#0b0b12;--panel:#13131d;--card:#1b1b28;--line:#262636;--txt:#f2f2f7;--mut:#8d8da3;--roxo:#8b5cf6;--roxo2:#a78bfa;--ciano:#22d3ee;--verm:#ff4d4d;--amar:#facc15}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07070b;color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{max-width:560px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* topo */
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--line)}
.logo{font-size:20px;font-weight:600}.logo b{color:var(--roxo2);font-weight:600}
.ver{font-size:11px;color:var(--mut);background:var(--card);padding:3px 8px;border-radius:8px;margin-left:6px}
.topo-dir{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mut)}.topo-dir b{color:var(--txt)}
#btnExp{display:flex;align-items:center;gap:6px;background:var(--roxo);padding:9px 16px;border-radius:20px;font-weight:600;box-shadow:0 4px 14px #8b5cf655}
#btnExp .i{width:17px;height:17px}
/* preview */
#stage{position:relative;flex:1 1 0;min-height:110px;background:#000;overflow:hidden}
.lay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
#vazio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);z-index:1}
#vazio p{margin-bottom:12px;font-size:15px}
#btnAdd{display:inline-flex;align-items:center;gap:8px;background:var(--roxo);color:#fff;padding:12px 22px;border-radius:24px;font-weight:600}
.lado{position:absolute;display:flex;flex-direction:column;gap:10px;top:50%;transform:translateY(-50%);z-index:1000}
.lado.e{left:10px}.lado.d{right:10px}
.lado button{width:38px;height:38px;border-radius:12px;background:#1b1b28cc;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
/* controles */
#ctrl{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);font-size:13px;color:var(--mut)}
#ctrl div{display:flex;gap:26px;align-items:center;color:var(--txt)}
#ctrl .i{width:22px;height:22px}
#tools{display:flex;justify-content:flex-end;gap:6px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line)}
#tools button{width:34px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#tools .i{width:16px;height:16px}
/* linha do tempo */
#tlWrap{position:relative;flex:0 0 auto;min-height:84px;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
#tl{position:relative;height:96px;background:var(--bg);overflow:auto;touch-action:pan-x pan-y;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
#trilho{position:relative;min-width:100%}
#semVid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;pointer-events:none}
.row{position:absolute;left:0;right:0;border-top:1px solid #ffffff0d}
.gut{position:absolute;left:0;right:0;font-size:9px;color:var(--mut);text-align:center;border:1px dashed transparent;line-height:22px}
.drag .gut{border-color:var(--roxo2)}
.it{position:absolute;z-index:2;border-radius:8px;border:2px solid transparent;overflow:hidden;font-size:10px;padding:0 6px;display:flex;align-items:center;gap:4px;white-space:nowrap;user-select:none;-webkit-user-select:none}
.it.v{background:linear-gradient(135deg,#4c3a8f,#6d4fd6);color:#e9e3ff}
.it.a{background:#0e3340;border-color:var(--ciano);color:var(--ciano)}
.it.sel{border-color:var(--amar);touch-action:none}
.it .i{width:13px;height:13px;flex:none}
.mais{position:absolute;z-index:6;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--card);border:1.5px solid var(--roxo2);color:var(--roxo2);display:flex;align-items:center;justify-content:center}
.mais .i{width:14px;height:14px}
.mais{box-shadow:0 2px 8px #0009}
.mais.on{box-shadow:0 0 0 2px #8b5cf655,0 2px 8px #0009}
.mais.on{background:var(--roxo);color:#fff;border-color:#fff}
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--verm);box-shadow:0 0 8px var(--verm);pointer-events:none;left:50%;transform:translateX(-1px);z-index:20}
#head::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--verm)}
/* gaveta (efeitos, ajustes, duração, transição) */
#gaveta{display:none;flex:0 0 auto;max-height:40vh;overflow-y:auto;background:var(--panel);border-top:2px solid var(--line);padding:0 12px 10px}
.gh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);padding:10px 0;z-index:3;font-size:14px}
.gh button{display:flex;gap:10px}
.msg{color:var(--mut);font-size:13px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{padding:8px 0 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11px;color:#cfcfe0}
.grid button.on{border-color:var(--roxo2);background:#2a2150}
.grid span{display:flex;justify-content:center;color:var(--roxo2);margin-bottom:4px}
h5{font-size:11px;letter-spacing:.6px;color:var(--mut);text-transform:uppercase;margin:12px 0 2px}
.sl{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:8px}
.sl input{width:100%;accent-color:var(--roxo)}
.sl em{font-style:normal;text-align:right;color:var(--txt);font-size:12px}
.reset{margin-top:12px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:12px}
/* barra inferior */
nav{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
nav button.on{color:var(--roxo2)}
nav .i{width:22px;height:22px}
nav button:disabled{opacity:.3;cursor:default}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.on{opacity:1}
#exp{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:100}
#exp>div{background:transparent;border:0;border-radius:0;padding:24px;width:min(88vw,360px);text-align:center}
#exp p{margin-bottom:14px;font-size:14px}
#expPreview{position:relative;width:100%;max-height:32vh;aspect-ratio:16/9;background:#050509;border-radius:8px;overflow:hidden;margin:0 auto 14px}
#expThumb{width:100%;height:100%;object-fit:contain;display:block}
#expFill{position:absolute;inset:0 0 auto;height:0;background:#8b5cf6b8;pointer-events:none;transition:height .12s}
#expPercent{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;text-shadow:0 2px 8px #000;z-index:2}
#barra{display:none;height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:16px}
#barra i{display:block;height:100%;width:0;background:var(--roxo)}
#cancelar{padding:9px 20px;border-radius:12px;border:1px solid var(--line);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><span class="logo">Mappa<b>Editor</b></span><span class="ver">v4.8</span></div>
    <div class="topo-dir"><span>Total: <b id="total">0:00.0</b></span><button id="btnExp"><span data-i="download"></span>Exportar</button></div>
  </header>
  <div id="stage">
    <div id="vazio"><p>Sua área de edição está vazia</p><button id="btnAdd"><span data-i="plus"></span>Adicionar vídeo</button></div>
    <div class="lado e"><button id="bFull" data-i="full"></button><button id="bProp" data-i="ratio"></button></div>
    <div class="lado d"><button id="bZoom" data-i="zoom"></button><button id="bMudo" data-i="vol"></button></div>
  </div>
  <div id="ctrl"><span id="tempo">0:00.0 / 0:00.0</span><div><button id="bPrev" data-i="prev"></button><button id="bPlay" data-i="play"></button><button id="bNext" data-i="next"></button></div></div>
  <div id="tools">
    <button id="zMenos" data-i="minus"></button><button id="zMais" data-i="plus"></button>
    <button id="zFit" data-i="fit"></button><button id="zAlt" data-i="height"></button>
  </div>
  <div id="tlWrap"><div id="tl"><div id="trilho"><div id="semVid">Sem vídeos na linha do tempo</div></div></div><div id="head"></div></div>
  <div id="gaveta"></div>
  <nav>
    <button id="nAdd"><span data-i="plus"></span>Adicionar</button>
    <button id="nOver"><span data-i="overlay"></span>Sobrepor</button>
    <button id="nAud"><span data-i="music"></span>Áudio</button>
    <button id="nDiv"><span data-i="scissors"></span>Dividir</button>
    <button id="nDur"><span data-i="clock"></span>Duração</button>
    <button id="nAju"><span data-i="sliders"></span>Ajustes</button>
    <button id="nFx"><span data-i="sparkles"></span>Efeitos</button>
    <button id="nDup"><span data-i="copy"></span>Duplicar</button>
    <button id="nDel"><span data-i="trash"></span>Excluir</button>
  </nav>
</div>
<div id="exp"><div><p style="color:#fff;margin-bottom:18px">Exportando vídeo…</p><div id="expPreview"><canvas id="expThumb"></canvas><div id="expFill"></div><div id="expPercent">0%</div></div><div id="barra"><i></i></div><button id="cancelar">Cancelar</button></div></div>
<input type="file" id="file" accept="video/*" multiple hidden>
<input type="file" id="fileA" accept="audio/*" multiple hidden>
<canvas id="cv" hidden></canvas>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="toast"></div>

<script>
/* ===== ÍCONES ===== */
const P={
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',
scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
sparkles:'<path d="M11 3l1.8 4.7L17.5 9.5l-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',ratio:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
zoom:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
vol:'<path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7"/>',mute:'<path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/>',
prev:'<path d="M6 5v14M18 5l-9 7 9 7z"/>',next:'<path d="M18 5v14M6 5l9 7-9 7z"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',
zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
fade:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
swap:'<path d="M7 8h12l-3-3M17 16H5l3 3"/>',none:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
zoomfx:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/>',
fit:'<path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/>',height:'<path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',overlay:'<rect x="3" y="7" width="12" height="12" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v10"/>',
vibrate:'<path d="M3 9v6M7 6v12M17 6v12M21 9v6"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
tv:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/>',
contrast:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 4h8v16H4z" fill="currentColor"/>',
coffee:'<path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
flip:'<path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/>',cine:'<rect x="2" y="6" width="20" height="12" rx="1"/><path d="M2 9h20M2 15h20"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+P[n]+'</svg>';
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));

/* ===== ESTADO ===== */
const $=id=>document.getElementById(id), stage=$('stage'), tl=$('tl'), tr=$('trilho');
let items=[];            // todos os clipes: vídeo (k:'v') e áudio (k:'a')
let sel=null, trItem=null, gt=0, tocando=false, painel=null, PX=40, LH=44, uid=1, muteAll=false, addMode='main', exporting=false, novoAtivo=false;
const TOP=24, BOT=24;
const ADJ0={op:100,es:100,px:0,py:0,vo:100,br:0,ex:0,ct:0,sa:0,hu:0,te:0,so:0,re:0,pr:0,bn:0};
const TONE=['br','ex','ct','so','re','pr','bn','te'];

/* ===== EFEITOS E TRANSIÇÕES ===== */
const FX={
 glitch:{n:'Glitch',ic:'zap',f:g=>({css:'contrast(1.3) saturate(1.5) hue-rotate('+(((g*12|0)%3)*40)+'deg)',tx:((g*14|0)%4===0)?.02:0})},
 blur:{n:'Blur',ic:'drop',css:'blur(4px)'},
 fade:{n:'Fade',ic:'fade',css:'brightness(.6)',op:.8},
 tremor:{n:'Tremor',ic:'vibrate',f:g=>({tx:Math.sin(g*70)*.012,ty:Math.cos(g*83)*.012})},
 pulso:{n:'Pulso',ic:'pulse',f:g=>({sc:1+.06*Math.abs(Math.sin(g*6))})},
 vhs:{n:'VHS',ic:'tv',css:'saturate(1.4) contrast(1.15) blur(.6px) hue-rotate(-8deg)',f:g=>({tx:((g*9|0)%5===0)?.006:0})},
 pb:{n:'P&B',ic:'contrast',css:'grayscale(1) contrast(1.1)'},
 sepia:{n:'Sépia',ic:'coffee',css:'sepia(1)'},
 neg:{n:'Negativo',ic:'target',css:'invert(1)'},
 vintage:{n:'Vintage',ic:'film',css:'sepia(.5) contrast(1.1) saturate(1.3) hue-rotate(-10deg)'},
 neon:{n:'Neon',ic:'sparkles',css:'saturate(2.6) contrast(1.25) brightness(1.1)'},
 espelho:{n:'Espelho',ic:'flip',sx:-1},
 cinema:{n:'Cinema',ic:'cine',css:'contrast(1.2) saturate(.85) brightness(.92)'},
 flash:{n:'Flash',ic:'sun',f:g=>({css:'brightness('+(1+1.2*Math.pow(Math.max(0,Math.sin(g*5)),8))+')'})}
};
const TR={fade:{ic:'fade',n:'Fusão'},white:{ic:'sun',n:'Branco'},zoom:{ic:'zoomfx',n:'Zoom'},slide:{ic:'arrow',n:'Deslizar'}};
const ADJ_CAM=[['op','Opacidade',0,100],['es','Escala',10,300],['px','Posição X',-100,100],['py','Posição Y',-100,100],['vo','Volume',0,100]];
const ADJ_COR=[['br','Brilho'],['ex','Exposição'],['ct','Contraste'],['sa','Saturação'],['hu','Cores (matiz)'],['te','Temperatura'],['so','Sombras'],['re','Realces'],['pr','Pretos'],['bn','Brancos']].map(a=>[...a,-100,100]);

/* ===== UTILIDADES ===== */
const len=c=>c.fim-c.ini;
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0');};
const total=()=>items.reduce((m,i)=>Math.max(m,i.s+len(i)),0);
const main=()=>items.filter(i=>i.k==='v'&&i.ly===0).sort((a,b)=>a.s-b.s);
const lanes=()=>{const v=items.filter(i=>i.k==='v'),a=items.filter(i=>i.k==='a');return{nV:Math.max(1,...v.map(i=>i.ly+1)),nA:a.length?Math.max(...a.map(i=>i.ly+1)):0};};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800);}
const meta=(url,tag)=>new Promise(r=>{const v=document.createElement(tag);v.preload='metadata';v.src=url;v.onloadedmetadata=()=>r({d:v.duration||0,w:v.videoWidth,h:v.videoHeight});v.onerror=()=>r({d:0});});

/* ===== CORES: curva de tons (usa filtro SVG) ===== */
function curve(a,ch){
  const v=[],cl=x=>Math.min(1,Math.max(0,x));
  for(let i=0;i<=32;i++){
    let x=i/32; x*=Math.pow(2,a.ex/100); x+=a.br/200; x=cl((x-.5)*(1+a.ct/100)+.5);
    x+=.25*a.so/100*Math.pow(1-x,2)+.25*a.re/100*x*x+.2*a.pr/100*Math.pow(1-x,5)+.2*a.bn/100*Math.pow(x,5);
    if(ch==='R')x*=1+a.te/400; if(ch==='B')x*=1-a.te/400;
    v.push(cl(x).toFixed(3));
  }
  return v.join(' ');
}
function updTone(it){const f=document.getElementById('f'+it.id).firstChild.children;['R','G','B'].forEach((c,i)=>f[i].setAttribute('tableValues',curve(it.adj,c)));}
const tonal=a=>TONE.some(k=>a[k]!==0);

/* ===== CRIAR / REMOVER ITENS ===== */
function mkItem(k,m){
  const el=document.createElement(k==='v'?'video':'audio'); el.preload='auto'; el.src=m.url;
  if(k==='v'){el.playsInline=true;el.preload='auto';el.className='lay';stage.appendChild(el);}
  const it={k,id:uid++,url:m.url,nome:m.nome,dur:m.dur,ini:m.ini||0,fim:m.fim||m.dur,s:m.s||0,ly:m.ly||0,el};
  if(k==='v'){el.addEventListener('seeked',()=>{if(!tocando&&!novoAtivo&&it._on)requestAnimationFrame(frame);});el.addEventListener('loadeddata',()=>{if(!tocando&&!novoAtivo&&it._on)requestAnimationFrame(frame);});}
  if(k==='v'){
    Object.assign(it,{w:m.w,h:m.h,fx:m.fx||null,tr:null,adj:{...ADJ0,...(m.adj||{})}});
    $('defs').insertAdjacentHTML('beforeend','<filter id="f'+it.id+'" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="0 1"/><feFuncG type="table" tableValues="0 1"/><feFuncB type="table" tableValues="0 1"/></feComponentTransfer></filter>');
    updTone(it);
  } else it.vol=m.vol==null?1:m.vol;
  return it;
}
const cp=it=>mkItem(it.k,{...it,adj:it.adj&&{...it.adj}});
function rm(it){it.el.pause();it.el.remove();const f=document.getElementById('f'+it.id);if(f)f.remove();items.splice(items.indexOf(it),1);}

/* ===== CAMADAS ===== */
function compacta0(){let t=0;main().forEach(i=>{i.s=t;t+=len(i);});}   // camada principal sem lacunas
function resolve(it){while(items.some(o=>o!==it&&o.k===it.k&&o.ly===it.ly&&o.s<it.s+len(it)-.001&&it.s<o.s+len(o)-.001))it.ly++;}
function norm(){[['v',1],['a',0]].forEach(([k,b])=>{const ls=[...new Set(items.filter(i=>i.k===k&&i.ly>=b).map(i=>i.ly))].sort((x,y)=>x-y);items.forEach(i=>{if(i.k===k&&i.ly>=b)i.ly=b+ls.indexOf(i.ly);});});}
function place(it){if(it.k==='v'&&it.ly===0)compacta0();else resolve(it);norm();compacta0();}

/* ===== ADICIONAR ===== */
$('btnAdd').onclick=$('nAdd').onclick=()=>{addMode='main';$('file').click();};
$('nOver').onclick=()=>{addMode='over';$('file').click();};
$('nAud').onclick=()=>$('fileA').click();
$('file').onchange=async e=>{
  for(const f of e.target.files){
    const url=URL.createObjectURL(f), m=await meta(url,'video');
    if(!m.d){toast('Não consegui abrir: '+f.name);continue;}
    const it=mkItem('v',{url,nome:f.name,dur:m.d,w:m.w,h:m.h});
    if(addMode==='over'){it.s=gt;it.ly=1;}else{it.ly=0;it.s=main().reduce((t,i)=>Math.max(t,i.s+len(i)),0);}
    items.push(it);place(it);sel=it;
  }
  e.target.value='';render();
};
$('fileA').onchange=async e=>{
  for(const f of e.target.files){
    const url=URL.createObjectURL(f), m=await meta(url,'audio');
    if(!m.d){toast('Não consegui abrir: '+f.name);continue;}
    const it=mkItem('a',{url,nome:f.name,dur:m.d,s:gt});items.push(it);place(it);sel=it;
  }
  e.target.value='';render();
};
